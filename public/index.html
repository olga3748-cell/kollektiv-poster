function renderPeople(list){currentPeople=list||[];let e=$('people');e.innerHTML='';currentPeople.forEach(p=>{let d=document.createElement('div');d.className='person '+(p.id===myId?'you':'');d.textContent='P'+p.id+' · '+(roles[p.role]||'SPEKTATOR')+(p.id===myId?' · DU':'');e.append(d)});let title=document.createElement('div');title.className='hint';title.textContent=proposal?'ROLLBYTE ÄR ÖPPET':'Klicka på en annan roll för att föreslå byte.';e.append(title);let grid=document.createElement('div');grid.className='role-grid';Object.entries(roles).forEach(([id,n])=>{let rid=+id,holder=currentPeople.find(p=>p.role===rid),card=document.createElement('button');card.type='button';card.className='role-card '+(rid===myRole?'current':'')+(holder?' occupied':' free');card.innerHTML='<strong>'+n+'</strong><small>'+(rid===myRole?'DIN ROLL':holder?'P'+holder.id:'LEDIG')+'</small>';card.disabled=!!proposal||rid===myRole;card.onclick=()=>send({type:'roleRequest',requestedRole:rid});grid.append(card)});e.append(grid)}
function showProposal(p){proposal=p;let e=$('proposal');e.innerHTML='';e.classList.toggle('hidden',!p);renderPeople(currentPeople);if(!p)return;let holder=currentPeople.find(x=>x.role===p.requestedRole),target=roles[p.requestedRole]||'ROLL',targetInfo=holder?'P'+holder.id+' har rollen':'rollen är LEDIG',mine=p.requester===myId;let h=document.createElement('div');h.className='proposal-title';h.textContent='P'+p.requester+' vill byta till '+target+' · '+targetInfo;e.append(h);let votes=document.createElement('div');votes.className='votes';(p.members||currentPeople).forEach(m=>{let v=document.createElement('span');v.className='vote '+(p.approvals.includes(m.id)?'ok':'wait');v.textContent='P'+m.id+' '+(p.approvals.includes(m.id)?'✓':'?');votes.append(v)});e.append(votes);let count=document.createElement('div');count.className='vote-count';count.textContent=p.approvals.length+'/'+p.total+' godkända';e.append(count);if(!p.approvals.includes(myId)){let b=document.createElement('button');b.textContent='✓ GODKÄNN';b.onclick=()=>send({type:'roleApprove',proposalId:p.id});e.append(b)}if(mine){let b=document.createElement('button');b.textContent='AVBRYT';b.onclick=()=>send({type:'roleCancel',proposalId:p.id});e.append(b)}}
function sticker(s){let z=s.size,x=C.width*s.x/100,y=C.height*s.y/100;Q.save();Q.translate(x,y);Q.fillStyle=s.color;Q.strokeStyle=s.color;Q.lineWidth=Math.max(2,z*.025);Q.beginPath();if(s.shape==='circle')Q.arc(0,0,z/2,0,Math.PI*2);else if(s.shape==='square')Q.rect(-z/2,-z/2,z,z);else if(s.shape==='heart'){Q.moveTo(0,z*.4);Q.bezierCurveTo(-z*.65,-z*.05,-z*.45,-z*.55,0,-z*.25);Q.bezierCurveTo(z*.45,-z*.55,z*.65,-z*.05,0,z*.4)}else if(s.shape==='spiral'){for(let t=0;t<Math.PI*5;t+=.08){let r=z*.04+t*z*.025,x2=Math.cos(t)*r,y2=Math.sin(t)*r;t?Q.lineTo(x2,y2):Q.moveTo(x2,y2)}Q.stroke()}else for(let i=0;i<10;i++){let r=i%2?z*.22:z*.5,a0=-Math.PI/2+i*Math.PI/5,xx=Math.cos(a0)*r,yy=Math.sin(a0)*r;i?Q.lineTo(xx,yy):Q.moveTo(xx,yy)}if(s.shape!=='spiral')Q.fill();Q.restore()}
function drawStroke(st){let p=st.points;if(p.length<2)return;let j=S.brush.jitter/100;Q.save();Q.globalAlpha=S.brush.opacity;Q.strokeStyle=st.color||'#fff';Q.lineWidth=S.brush.size;Q.lineCap='round';if(S.brush.type==='soft'){Q.shadowBlur=S.brush.size;Q.shadowColor=Q.strokeStyle}if(S.brush.type==='dry')Q.globalAlpha*=.55;Q.beginPath();p.forEach((q,k)=>{let x=q.x*C.width,y=q.y*C.height;if(S.brush.type==='ink'){x+=Math.sin(k*.7)*j*4;y+=Math.cos(k*.5)*j*4}x+=Math.sin(k*S.brush.spacing)*j*18;y+=Math.cos(k*S.brush.spacing)*j*18;k?Q.lineTo(x,y):Q.moveTo(x,y)});Q.stroke();Q.restore()}
const noiseCache=new Map();
function texture(){let t=S.texture,s=Math.max(4,t.scale);Q.save();Q.globalAlpha=t.opacity;Q.fillStyle=t.color;Q.strokeStyle=t.color;Q.lineWidth=1;
if(t.type==='noise'){let key='noise-'+C.width+'x'+C.height;let im=noiseCache.get(key);if(!im){im=Q.createImageData(C.width,C.height);let d=im.data;for(let i=0;i<d.length;i+=4){let v=110+Math.random()*145;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255*.32}noiseCache.set(key,im)}Q.putImageData(im,0,0)}
else if(t.type==='ascii'){Q.font=Math.max(8,s*.7)+'px monospace';let chars='@#8&$%*o!;:,. ';for(let y=8;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){let k=Math.floor(Math.random()*chars.length);Q.fillText(chars[k],x,y)}}
else if(t.type==='grain'){for(let i=0;i<9000;i++){let v=Math.random()*255;Q.globalAlpha=t.opacity*(.15+.7*Math.random());Q.fillStyle=`rgb(${v},${v},${v})`;Q.fillRect(Math.random()*C.width,Math.random()*C.height,1,1)}}
else if(t.type==='dots')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.beginPath();Q.arc(x,y,1.5,0,7);Q.fill()}
else if(t.type==='lines'||t.type==='hatch')for(let x=-C.height;x<C.width;x+=s*2){Q.beginPath();Q.moveTo(x,0);Q.lineTo(x+C.height,C.height);Q.stroke()}

else if(t.type==='cross')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.fillRect(x-1,y-1,3,3);Q.fillRect(x-1,y-s*.35,3,s*.7)}

else if(t.type==='rings')for(let y=0;y<C.height;y+=s*2)for(let x=0;x<C.width;x+=s*2){Q.beginPath();Q.arc(x,y,s*.35,0,7);Q.stroke()}

const photoCache=new Map();
function photo(p){if(!p?.src)return;let im=photoCache.get(p.src);if(im?.complete&&im.naturalWidth){drawPhotoImage(p,im);return}if(im)return;im=new Image();photoCache.set(p.src,im);im.onload=()=>scheduleRender();im.src=p.src}
function drawPhotoImage(p,im){let maxW=C.width*p.w/100,h=maxW*im.naturalHeight/im.naturalWidth,x=C.width*p.x/100-maxW/2,y=C.height*p.y/100-h/2;Q.save();Q.globalAlpha=p.opacity??1;Q.translate(x+maxW/2,y+h/2);Q.rotate((p.rotate||0)*Math.PI/180);let filter=p.filter==='svartvit'?'grayscale(1)':p.filter==='kontrast'?'contrast(1.8)':p.filter==='invert'?'invert(1)':'none';Q.filter=filter;if(p.warp){let n=Math.max(1,Math.floor(p.warp/12));for(let i=0;i<n;i++){let yy=-h/2+i*h/n;let sh=h/n+1,off=Math.sin((i/n)*Math.PI*4)*p.warp*.6;Q.drawImage(im,-maxW/2+off,yy,maxW,sh)} }else Q.drawImage(im,-maxW/2,-h/2,maxW,h);if(p.tint&&p.tint!=='#ffffff'){Q.globalCompositeOperation='source-atop';Q.globalAlpha=(p.opacity??1)*.45;Q.fillStyle=p.tint;Q.fillRect(-maxW/2,-h/2,maxW,h)}Q.restore()}
function scene(){let w=C.width,h=C.height,b=S.bg,r=b.angle*Math.PI/180;Q.clearRect(0,0,w,h);if(b.mode==='solid')Q.fillStyle=b.colorA;else{let g=Q.createLinearGradient(w/2-Math.cos(r)*w,h/2-Math.sin(r)*h,w/2+Math.cos(r)*w,h/2+Math.sin(r)*h);g.addColorStop(0,b.colorA);g.addColorStop(1,b.colorB);Q.fillStyle=g}Q.fillRect(0,0,w,h);texture();S.photos.forEach(photo);S.stickers.forEach(sticker);S.draw.layers.forEach(l=>l.strokes.forEach(drawStroke));Q.textAlign='center';Q.textBaseline='middle';S.textLayers.forEach(t=>{let x=w*t.x/100,y=h*t.y/100;Q.save();Q.translate(x,y);Q.transform((t.width||100)/100,0,Math.tan((t.skew||0)*Math.PI/180),(t.height||100)/100,0,0);Q.font=`${t.weight||'700'} ${t.size||42}px "${t.font||'Arial'}"`;Q.fillStyle=t.color||'#fff';if(t.shadow){Q.shadowColor='rgba(0,0,0,.6)';Q.shadowBlur=8}Q.fillText(t.value||'',0,0);Q.restore()})}
function chaos(){let a=(S.chaos.amount||0)/100,f=S.chaos.frequency||5;X.clearRect(0,0,C.width,C.height);if(!a){X.drawImage(SC,0,0);return}const mode=S.chaos.mode;if(mode==='rotation'){X.save();X.translate(C.width/2,C.height/2);X.rotate(a*.12);X.drawImage(SC,-C.width/2,-C.height/2);X.restore()}else if(mode==='solarize'){X.drawImage(SC,0,0);let im=X.getImageData(0,0,C.width,C.height),d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i]<128?255-d[i]:d[i];d[i+1]=d[i+1]<128?255-d[i+1]:d[i+1];d[i+2]=d[i+2]<128?255-d[i+2]:d[i+2]}X.putImageData(im,0,0)}else if(mode==='echo'){X.drawImage(SC,0,0);X.globalAlpha=a*.28;for(let i=1;i<=3;i++)X.drawImage(SC,(i*a*18)%30,(i*a*14)%30);X.globalAlpha=1}else if(mode==='scatter'){X.drawImage(SC,0,0);let n=Math.floor(10+a*70);for(let i=0;i<n;i++){let x=Math.random()*C.width,y=Math.random()*C.height,w=20+Math.random()*80,h=10+Math.random()*50;X.drawImage(SC,x,y,w,h,x+(Math.random()-.5)*a*60,y+(Math.random()-.5)*a*60,w,h)}}else{let step=Math.max(2,Math.floor(40/f)),amp=a*(mode==='glitch'?120:mode==='ripple'?80:45);for(let y=0;y<C.height;y+=step){let off=Math.sin(y/f*.8)*amp+(mode==='glitch'&&Math.random()<.18?(Math.random()-.5)*amp*2:0);X.drawImage(SC,0,y,C.width,Math.min(step,C.height-y),off,y,C.width,Math.min(step,C.height-y))}}if(S.chaos.glow){X.save();X.globalCompositeOperation='screen';X.globalAlpha=S.chaos.glow/100*.45;X.shadowBlur=18+S.chaos.glow;X.shadowColor='#fff';X.drawImage(X.canvas,0,0);X.restore()}C.getContext('2d').clearRect(0,0,C.width,C.height);C.getContext('2d').drawImage(X.canvas,0,0)}
function render(){scene();if(drawing&&pts.length>1){let layer=S.draw.layers.find(l=>l.id===S.draw.activeLayer)||S.draw.layers[0];drawStroke({points:pts,color:layer.color})}chaos()}
function point(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
C.onpointerdown=e=>{if(myRole!==6)return;drawing=true;pts=[point(e)];C.setPointerCapture(e.pointerId)}
C.onpointermove=e=>{if(!drawing)return;pts.push(point(e));scheduleRender()}
C.onpointerup=()=>{if(drawing){drawing=false;if(pts.length>1){let l=S.draw.layers.find(x=>x.id===S.draw.activeLayer)||S.draw.layers[0];send({type:'stroke',layerId:l.id,color:l.color,points:pts})}pts=[];render()}}
$('clear').onclick=()=>send({type:'clear',layerId:S.draw.activeLayer});
$('download').onclick=()=>{render();let a=document.createElement('a');a.download='kollektiv-poster.png';a.href=C.toDataURL('image/png');a.click()}
function openCamera(){let modal=document.createElement('div');modal.className='camera-modal';modal.innerHTML='<div class="camera-box"><video autoplay playsinline></video><div><button id="snap">TA BILD</button><button id="closeCam">STÄNG</button></div></div>';$('controls').append(modal);let v=modal.querySelector('video');navigator.mediaDevices?.getUserMedia({video:true}).then(stream=>{v.srcObject=stream;modal.querySelector('#snap').onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth||900;c.height=v.videoHeight||1200;c.getContext('2d').drawImage(v,0,0,c.width,c.height);filePhotoData(c.toDataURL('image/jpeg',.85));closeCam(modal)}}).catch(()=>{});modal.querySelector('#closeCam').onclick=()=>closeCam(modal)}
function closeCam(m){m.querySelector('video')?.srcObject?.getTracks().forEach(t=>t.stop());m.remove()}
function filePhoto(f){if(!f)return;let r=new FileReader();r.onload=()=>filePhotoData(r.result);r.readAsDataURL(f)}
function filePhotoData(src){const id=Date.now()+Math.floor(Math.random()*1000);S.photos.push({id,src,x:50,y:50,w:45,opacity:1,filter:'normal',tint:'#ffffff',warp:0,rotate:0});set('photos',S.photos)}
render();

</script></body></html>
