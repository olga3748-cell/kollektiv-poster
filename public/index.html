<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOLLEKTIV POSTER 3.4</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div><div class="logo">KOLLEKTIV / POSTER_3.4</div><div class="tiny">SEVEN PEOPLE · ONE IMAGE · LIVE</div></div><div id="status" class="status">OFFLINE</div></header>
<main>
<section class="entry panel"><label>ROOM</label><input id="room" value="MAIN" maxlength="40"><button id="enter">ENTER ROOM</button><span id="roleLabel">ROLE: —</span></section>
<section class="workspace">
<div class="poster-wrap"><canvas id="poster" width="900" height="1200"></canvas></div>
<aside class="side">
<div class="panel"><div class="section-title">YOUR ROLE</div><div id="controls"></div></div>
<div class="panel"><div class="section-title">ROLE CHANGE</div><div id="people"></div><div id="proposal" class="proposal hidden"></div></div>
<div class="panel chat-panel"><div class="section-title">CHAT / SIGNALS</div><div id="chat"></div>
<div class="quick"><button data-chat="↗ more chaos">↗ CHAOS</button><button data-chat="↓ less">↓ LESS</button><button data-chat="++ MORE">++ MORE</button><button data-chat="↔ move it">↔ MOVE</button></div>
<div class="chat-input"><input id="chatText" maxlength="240" placeholder="say something..."><button id="sendChat">SEND</button></div></div>
<div class="panel"><button id="download">↓ DOWNLOAD PNG</button><button id="clear" class="danger hidden">CLEAR DRAWING</button></div>
<div class="panel tiny"><div>1 BACKGROUND</div><div>2 TEXTURE</div><div>3 GRAPHICS</div><div>4 BRUSH</div><div>5 TEXT</div><div>6 TYPE</div><div>7 CHAOS</div></div>
</aside></section></main>

<script>
const canvas=document.getElementById("poster"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),controls=document.getElementById("controls"),chat=document.getElementById("chat");
const roleLabel=document.getElementById("roleLabel"),people=document.getElementById("people"),proposalEl=document.getElementById("proposal");
let ws=null,role=null,pendingRoom=null,myId=null,currentProposal=null,drawing=false,currentPoints=[];
let state={bg:{mode:"gradient",colorA:"#0a0a0a",colorB:"#3a2a55",angle:135},texture:{type:"noise",opacity:.12,color:"#fff",scale:18},brush:{size:8,opacity:.8,type:"soft"},textLayers:[{id:1,value:"COLLECTIVE SIGNAL",x:50,y:16,color:"#fff",visible:true}],type:{font:"Arial",weight:"700",size:42,letterSpacing:2},strokes:[],chaos:{amount:0,mode:"jitter",frequency:5}};
let roles=[{id:1,name:"BACKGROUND"},{id:2,name:"TEXTURE"},{id:3,name:"GRAPHICS"},{id:4,name:"BRUSH"},{id:5,name:"TEXT"},{id:6,name:"TYPE"},{id:7,name:"CHAOS"}];

function setStatus(s){statusEl.textContent=s;statusEl.className="status "+s.toLowerCase()}
function roleName(n){return roles.find(r=>r.id===n)?.name||"—"}
function send(o){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(o))}
function connect(){
 if(ws&&(ws.readyState===WebSocket.OPEN||ws.readyState===WebSocket.CONNECTING))return;
 const proto=location.protocol==="https:"?"wss:":"ws:";setStatus("CONNECTING");
 ws=new WebSocket(proto+"//"+location.host+"/ws");
 ws.onopen=()=>{setStatus("ONLINE");if(pendingRoom!==null){send({type:"join",room:pendingRoom});pendingRoom=null}};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==="hello"){myId=m.clientId;state=m.state;roles=m.roles||roles;render()}
  else if(m.type==="joined"){role=m.role;state=m.state;currentProposal=m.proposal;applyRole();render();showProposal(currentProposal)}
  else if(m.type==="roleChanged"){role=m.role;applyRole();render();addChat("SYSTEM: your role is now "+roleName(role))}
  else if(m.type==="presence"){renderPeople(m.clients)}
  else if(m.type==="roleProposal"){currentProposal=m.proposal;showProposal(currentProposal)}
  else if(m.type==="state"){state[m.key]=m.value;render();buildControls()}
  else if(m.type==="stroke"){state.strokes.push(m.stroke);render()}
  else if(m.type==="clear"){state.strokes=[];render()}
  else if(m.type==="chat"){addChat((m.from?"P"+m.from:"??")+": "+m.text)}
 };
 ws.onclose=()=>{setStatus("OFFLINE");role=null;roleLabel.textContent="ROLE: —";controls.innerHTML=""};
 ws.onerror=()=>setStatus("ERROR");
}
document.getElementById("enter").onclick=()=>{pendingRoom=document.getElementById("room").value.trim()||"MAIN";connect();if(ws&&ws.readyState===WebSocket.OPEN){send({type:"join",room:pendingRoom});pendingRoom=null}};
function applyRole(){roleLabel.textContent="ROLE: "+roleName(role);buildControls();document.getElementById("clear").classList.toggle("hidden",role!==3)}
function update(key,patch){state[key]=Array.isArray(state[key])?patch:({...state[key],...patch});send({type:"setState",key,value:patch});render()}
function updateTextLayers(){send({type:"setState",key:"textLayers",value:state.textLayers});render()}
function control(label,input){const row=document.createElement("label");row.className="control";const title=document.createElement("span");title.textContent=label;row.append(title,input);controls.appendChild(row)}
function slider(key,prop,label,min,max,step){const input=document.createElement("input");input.type="range";input.min=min;input.max=max;input.step=step;input.value=state[key][prop];const val=document.createElement("b");val.textContent=input.value;input.oninput=()=>{val.textContent=input.value;update(key,{[prop]:Number(input.value)})};const w=document.createElement("div");w.className="slider";w.append(input,val);control(label,w)}
function color(key,prop,label){const input=document.createElement("input");input.type="color";input.value=state[key][prop];input.oninput=()=>update(key,{[prop]:input.value});control(label,input)}
function select(key,prop,label,opts){const input=document.createElement("select");opts.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;input.append(o)});input.value=String(state[key][prop]);input.onchange=()=>update(key,{[prop]:input.value});control(label,input)}
function buildControls(){
 controls.innerHTML="";if(!role)return;
 if(role===1){select("bg","mode","MODE",["gradient","solid"]);color("bg","colorA","COLOR A");color("bg","colorB","COLOR B");slider("bg","angle","ANGLE",0,360,1)}
 if(role===2){select("texture","type","TEXTURE",["noise","dots","lines","cross","grid","waves","speckle","none"]);color("texture","color","COLOR");slider("texture","opacity","OPACITY",0,1,.01);slider("texture","scale","SCALE",4,70,1)}
 if(role===3){const n=document.createElement("div");n.className="hint";n.textContent="DRAW DIRECTLY ON THE POSTER";controls.append(n)}
 if(role===4){select("brush","type","BRUSH",["soft","hard","ink","dry"]);slider("brush","size","THICKNESS",1,80,1);slider("brush","opacity","OPACITY",0,1,.01)}
 if(role===5){const add=document.createElement("button");add.textContent="+ ADD TEXT LAYER";add.onclick=()=>send({type:"textAdd",value:"NEW TEXT"});controls.append(add);
   state.textLayers.forEach(layer=>{const box=document.createElement("div");box.className="text-layer";
    const input=document.createElement("input");input.value=layer.value;input.onchange=()=>{layer.value=input.value;updateTextLayers()};
    const c=document.createElement("input");c.type="color";c.value=layer.color||"#fff";c.oninput=()=>{layer.color=c.value;updateTextLayers()};
    const x=document.createElement("input");x.type="range";x.min=0;x.max=100;x.value=layer.x;x.oninput=()=>{layer.x=Number(x.value);updateTextLayers()};
    const y=document.createElement("input");y.type="range";y.min=0;y.max=100;y.value=layer.y;y.oninput=()=>{layer.y=Number(y.value);updateTextLayers()};
    const del=document.createElement("button");del.textContent="×";del.onclick=()=>send({type:"textRemove",id:layer.id});
    box.append(input,c,document.createTextNode("X"),x,document.createTextNode("Y"),y,del);controls.append(box);
   });
 }
 if(role===6){select("type","font","FONT",["Arial","Georgia","Courier New","Trebuchet MS","Impact"]);select("type","weight","WEIGHT",["400","500","700","900"]);slider("type","size","SIZE",12,120,1);slider("type","letterSpacing","SPACING",0,20,1)}
 if(role===7){select("chaos","mode","MODE",["jitter","warp","glitch","rotation"]);slider("chaos","amount","CHAOS",0,100,1);slider("chaos","frequency","FREQUENCY",1,20,1);const n=document.createElement("div");n.className="hint";n.textContent="CHAOS AFFECTS BACKGROUND, TEXTURE, GRAPHICS, BRUSH AND TYPE.";controls.append(n)}
}
function renderPeople(list){people.innerHTML="";(list||[]).forEach(p=>{const row=document.createElement("div");row.className="person";row.textContent="P"+p.id+" · "+roleName(p.role)+(p.id===myId?" · YOU":"");people.append(row)});
 const select=document.createElement("select");select.id="roleSelect";roles.forEach(r=>{const o=document.createElement("option");o.value=r.id;o.textContent=r.id+" · "+r.name;select.append(o)});
 const btn=document.createElement("button");btn.textContent="REQUEST CHANGE";btn.onclick=()=>send({type:"roleRequest",requestedRole:Number(select.value)});
 if(role){people.append(select,btn)}
}
function showProposal(p){
 proposalEl.classList.toggle("hidden",!p);if(!p)return;
 const approved=p.approvals?.length||0,total=p.total||0;
 proposalEl.innerHTML=`<b>ROLE CHANGE PROPOSAL</b><br>P${p.requester} wants ${roleName(p.requestedRole)}.<br><span>${approved}/${total} approved</span>`;
 if(!p.approvals?.includes(myId)){const b=document.createElement("button");b.textContent="✓ APPROVE";b.onclick=()=>send({type:"roleApprove"});proposalEl.append(b)}
 if(p.requester===myId){const b=document.createElement("button");b.textContent="CANCEL";b.onclick=()=>send({type:"roleCancel"});proposalEl.append(b)}
}
function addChat(t){const d=document.createElement("div");d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight;while(chat.children.length>50)chat.firstChild.remove()}
document.getElementById("sendChat").onclick=()=>{const i=document.getElementById("chatText"),t=i.value.trim();if(t){send({type:"chat",text:t});i.value=""}};
document.getElementById("chatText").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("sendChat").click()});
document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>send({type:"chat",text:b.dataset.chat}));

function jitter(v,i,amount,freq){return v+Math.sin(i*freq*.17)*amount}
function drawStroke(st,index){
 const p=st.points;if(!p||p.length<2)return;const amount=state.chaos.amount/100,mode=state.chaos.mode;
 ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.globalAlpha=state.brush.opacity;
 ctx.strokeStyle="#fff";ctx.lineWidth=state.brush.size*(1+amount*.65);
 if(state.brush.type==="soft"){ctx.shadowBlur=state.brush.size*1.4;ctx.shadowColor="#fff"} if(state.brush.type==="ink")ctx.lineWidth*=.75;if(state.brush.type==="dry")ctx.globalAlpha*=.65;
 ctx.beginPath();
 p.forEach((q,i)=>{let x=q.x*canvas.width,y=q.y*canvas.height;if(mode==="jitter"||mode==="glitch"){x=jitter(x,i+index,amount*70,state.chaos.frequency);y=jitter(y,i+index+20,amount*70,state.chaos.frequency)}if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.restore();
}
function render(){
 const w=canvas.width,h=canvas.height,b=state.bg,ca=state.chaos.amount/100,mode=state.chaos.mode;
 ctx.save();
 if(b.mode==="solid"){ctx.fillStyle=b.colorA;ctx.fillRect(0,0,w,h)}else{const r=(b.angle+(mode==="rotation"?ca*80:0))*Math.PI/180;const x1=w/2-Math.cos(r)*w,y1=h/2-Math.sin(r)*h,x2=w/2+Math.cos(r)*w,y2=h/2+Math.sin(r)*h;const g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,b.colorA);g.addColorStop(1,b.colorB);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
 ctx.restore();

 const t=state.texture,s=Math.max(4,t.scale*(1+(mode==="warp"?ca*.7:0)));ctx.save();ctx.globalAlpha=t.opacity;ctx.strokeStyle=t.color;ctx.fillStyle=t.color;
 if(t.type==="dots"){for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){ctx.beginPath();ctx.arc(x,y,1.2+ca*2,0,Math.PI*2);ctx.fill()}}
 else if(t.type==="lines"){for(let x=-h;x<w;x+=s*2){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+h,h);ctx.stroke()}}
 else if(t.type==="cross"){for(let y=0;y<h;y+=s)for(let x=0;x<w;x+=s){ctx.fillRect(x-1,y-1,3,3);ctx.fillRect(x-1,y-s*.35,3,s*.7)}}
 else if(t.type==="grid"){for(let y=0;y<h;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(let x=0;x<w;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}}
 else if(t.type==="waves"){for(let y=0;y<h;y+=s){ctx.beginPath();for(let x=0;x<w;x+=4)ctx.lineTo(x,y+Math.sin(x*.025)*s*.35);ctx.stroke()}}
 else if(t.type==="speckle"){for(let i=0;i<w*h/(s*s)*1.8;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2+1,0,7);ctx.fill()}}
 else if(t.type==="noise"){const img=ctx.createImageData(w,h),d=img.data;for(let i=0;i<d.length;i+=4){const v=80+Math.random()*175;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255*t.opacity*.7}ctx.putImageData(img,0,0)}
 ctx.restore();

 (state.strokes||[]).forEach((st,i)=>drawStroke(st,i));

 const tx=state.type;ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
 state.textLayers.forEach((layer,i)=>{if(layer.visible===false)return;let x=w*layer.x/100,y=h*layer.y/100;
   const a=state.chaos.amount/100;if(mode==="jitter"||mode==="glitch"){x+=Math.sin(i*7+Date.now()/800)*a*35;y+=Math.cos(i*9+Date.now()/900)*a*35}
   let size=tx.size*(1+(mode==="warp"?a*.35:0));ctx.font=`${tx.weight} ${size}px "${tx.font}"`;ctx.fillStyle=layer.color||"#fff";ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=8;
   if(mode==="glitch"&&a>.05){ctx.fillText(layer.value,x+a*10,y);ctx.globalAlpha=.35;ctx.fillText(layer.value,x-a*10,y);ctx.globalAlpha=1}else ctx.fillText(layer.value,x,y);
 });ctx.restore();
}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
canvas.addEventListener("pointerdown",e=>{if(role!==3)return;drawing=true;currentPoints=[point(e)];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;currentPoints.push(point(e));render();drawStroke({points:currentPoints},9999)});
canvas.addEventListener("pointerup",()=>{if(!drawing)return;drawing=false;if(currentPoints.length>1)send({type:"stroke",points:currentPoints});currentPoints=[]});
document.getElementById("clear").onclick=()=>send({type:"clear"});
document.getElementById("download").onclick=()=>{render();const a=document.createElement("a");a.download="kollektiv-poster.png";a.href=canvas.toDataURL("image/png");a.click()};
setStatus("OFFLINE");render();
</script>
</body></html>
