  stat('ANSLUTEN');

 };

  if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null}

   stat('ÅTERANSLUTER');

 };

function renderPeople(list){
  currentPeople=list||[];let e=$('people');e.innerHTML='';
  currentPeople.forEach(p=>{let d=document.createElement('div');d.className='person '+(p.id===myId?'you':'');d.textContent='P'+p.id+' · '+(roles[p.role]||'SPEKTATOR')+(p.id===myId?' · DU':'');e.append(d)});
  let title=document.createElement('div');title.className='hint';title.textContent=proposal?'ROLLBYTE PÅGÅR':'Välj en roll för att begära den.';e.append(title);
  if(!myRole)return;
  let grid=document.createElement('div');grid.className='role-grid';
  Object.entries(roles).forEach(([id,n])=>{
    let rid=+id,holder=currentPeople.find(p=>p.role===rid),card=document.createElement('button');
    card.type='button';card.className='role-card '+(rid===myRole?'current ':'')+(holder?'occupied':'free');
    card.disabled=!!proposal||rid===myRole;
    card.innerHTML='<strong>'+n+'</strong><small>'+(rid===myRole?'DIN ROLL':holder?'P'+holder.id:'LEDIG')+'</small>';
    card.title=rid===myRole?'Du har redan denna roll':proposal?'Vänta tills rollbytet är klart':'Begär '+n;
    card.onclick=()=>send({type:'roleRequest',requestedRole:rid});
    grid.append(card);
  });
  e.append(grid);
}

const noiseCache=new Map();
function hexRGB(hex){let h=String(hex||'#ffffff').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
function texture(){let t=S.texture,s=Math.max(4,t.scale);Q.save();Q.globalAlpha=1;Q.fillStyle=t.color;Q.strokeStyle=t.color;Q.lineWidth=1;

   for(let i=0;i<d.length;i+=4){let v=95+Math.random()*160;let a=18+Math.random()*55;d[i]=r*(v/255);d[i+1]=g*(v/255);d[i+2]=b*(v/255);d[i+3]=a}

 }
 else if(t.type==='grain'){for(let i=0;i<9000;i++){let v=Math.random()*255;Q.globalAlpha=t.opacity*(.15+.7*Math.random());Q.fillStyle=`rgb(${v},${v},${v})`;Q.fillRect(Math.random()*C.width,Math.random()*C.height,1,1)}}
 else if(t.type==='dots')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.beginPath();Q.arc(x,y,1.5,0,7);Q.fill()}
 else if(t.type==='lines'||t.type==='hatch')for(let x=-C.height;x<C.width;x+=s*2){Q.beginPath();Q.moveTo(x,0);Q.lineTo(x+C.height,C.height);Q.stroke()}
 else if(t.type==='grid')for(let y=0;y<C.height;y+=s){Q.beginPath();Q.moveTo(0,y);Q.lineTo(C.width,y);Q.stroke()} 
 else if(t.type==='cross')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.fillRect(x-1,y-1,3,3);Q.fillRect(x-1,y-s*.35,3,s*.7)}
 else if(t.type==='waves')for(let y=0;y<C.height;y+=s){Q.beginPath();for(let x=0;x<C.width;x+=4)Q.lineTo(x,y+Math.sin(x*.025)*s*.35);Q.stroke()}
 else if(t.type==='rings')for(let y=0;y<C.height;y+=s*2)for(let x=0;x<C.width;x+=s*2){Q.beginPath();Q.arc(x,y,s*.35,0,7);Q.stroke()}

 else if(t.type==='scribble')for(let y=0;y<C.height;y+=s*1.5){Q.beginPath();for(let x=0;x<C.width;x+=5)Q.lineTo(x,y+Math.sin(x*.04+y)*s*.5);Q.stroke()}
 else if(t.type==='bubbles')for(let i=0;i<300;i++){let x=Math.random()*C.width,y=Math.random()*C.height,r=2+Math.random()*s*.4;Q.beginPath();Q.arc(x,y,r,0,7);Q.stroke()}

const photoCache=new Map();
function photo(p){if(!p?.src)return;let im=photoCache.get(p.src);if(im?.complete&&im.naturalWidth){drawPhotoImage(p,im);return}if(im)return;im=new Image();photoCache.set(p.src,im);im.onload=()=>scheduleRender();im.onerror=()=>photoCache.delete(p.src);im.src=p.src}
function drawPhotoImage(p,im){let w=C.width*(p.w||45)/100,h=w*(im.naturalHeight/im.naturalWidth)*(p.hScale||100)/100;let x=C.width*p.x/100,y=C.height*p.y/100;F.save();F.translate(x,y);F.rotate((p.rotation||0)*Math.PI/180);F.transform(1,Math.tan((p.skewY||0)*Math.PI/180),Math.tan((p.skewX||0)*Math.PI/180),1,0,0);F.globalAlpha=p.opacity??1;let f=p.filter||'normal';if(f==='svartvit')F.filter='grayscale(1)';else if(f==='invert')F.filter='invert(1)';else if(f==='sepia')F.filter='sepia(1)';else if(f==='kontrast')F.filter='contrast(1.8)';else if(f==='tröskel')F.filter='contrast(8) grayscale(1)';F.drawImage(im,-w/2,-h/2,w,h);F.filter='none';if(p.tint){F.globalCompositeOperation='color';F.globalAlpha=(p.tintOpacity??.55)*(p.opacity??1);F.fillStyle=p.tint;F.fillRect(-w/2,-h/2,w,h);F.globalCompositeOperation='source-over'}if(f==='raster'){F.globalAlpha=.28*(p.opacity??1);F.fillStyle='#000';for(let yy=-h/2;yy<h/2;yy+=5)F.fillRect(-w/2,yy,w,2)}F.restore()}
const FG=document.createElement('canvas');FG.width=C.width;FG.height=C.height;const F=FG.getContext('2d');
function drawForeground(){F.clearRect(0,0,C.width,C.height);normalizeState();S.photos.forEach(photo);S.stickers.forEach(st=>stickerOn(F,st,S.chaos));S.draw.layers.forEach(l=>l.strokes.forEach(st=>drawOn(F,{...st,layerId:l.id})));F.textAlign='center';F.textBaseline='middle';S.textLayers.forEach(t=>{let x=C.width*t.x/100,y=C.height*t.y/100;F.save();F.translate(x,y);F.transform((t.width||100)/100,0,Math.tan((t.skew||0)*Math.PI/180),(t.height||100)/100,0,0);F.font=`${t.weight||'700'} ${t.size||42}px "${t.font||'Arial'}"`;F.fillStyle=t.color||'#fff';if(t.shadow){F.shadowColor='rgba(0,0,0,.6)';F.shadowBlur=8}F.fillText(t.value||'',0,0);F.restore()})}
function stickerOn(ctx,s,chaos){let z=s.size*(1+(chaos.amount/100)*.15),x=C.width*s.x/100,y=C.height*s.y/100;ctx.save();ctx.translate(x,y);ctx.fillStyle=s.color;ctx.strokeStyle=s.color;ctx.lineWidth=Math.max(2,z*.035);ctx.beginPath();if(s.shape==='circle')ctx.arc(0,0,z/2,0,Math.PI*2);else if(s.shape==='square')ctx.rect(-z/2,-z/2,z,z);else if(s.shape==='heart'){ctx.moveTo(0,z*.4);ctx.bezierCurveTo(-z*.65,-z*.05,-z*.45,-z*.55,0,-z*.25);ctx.bezierCurveTo(z*.45,-z*.55,z*.65,-z*.05,0,z*.4);ctx.fill();ctx.restore();return}else if(s.shape==='spiral'){for(let a=0;a<Math.PI*5;a+=.15){let r=z*.04+z*.025*a,xx=Math.cos(a)*r,yy=Math.sin(a)*r;a===0?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}ctx.stroke();ctx.restore();return}else for(let i=0;i<10;i++){let r=i%2?z*.22:z*.5,a0=-Math.PI/2+i*Math.PI/5,xx=Math.cos(a0)*r,yy=Math.sin(a0)*r;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.fill();ctx.restore()}
function drawOn(ctx,st,preview=false){let p=st.points;if(p.length<2)return;let j=S.brush.jitter/100,layer=S.draw.layers?.find(l=>l.id===st.layerId)||S.draw.layers?.find(l=>l.id===S.draw.activeLayer)||S.draw.layers?.[0];ctx.save();ctx.globalAlpha=S.brush.opacity;ctx.strokeStyle=layer?.color||S.draw.color||'#fff';ctx.lineWidth=S.brush.size;ctx.lineCap='round';if(S.brush.type==='soft'){ctx.shadowBlur=S.brush.size;ctx.shadowColor=ctx.strokeStyle}if(S.brush.type==='dry')ctx.globalAlpha*=.55;ctx.beginPath();p.forEach((q,k)=>{let x=q.x*C.width,y=q.y*C.height;if(S.brush.type==='ink'){x+=Math.sin(k*.7)*j*4;y+=Math.cos(k*.5)*j*4}x+=Math.sin(k*S.brush.spacing)*j*18;y+=Math.cos(k*S.brush.spacing)*j*18;k?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.restore()}
function chaos(){let a=(S.chaos.amount||0)/100,f=Math.max(1,S.chaos.frequency||5);X.clearRect(0,0,C.width,C.height);if(!a){X.drawImage(FG,0,0);return}const mode=S.chaos.mode;if(mode==='glow'){X.save();X.shadowColor='rgba(255,255,255,.95)';X.shadowBlur=8+a*38;X.globalAlpha=.35+.45*a;X.drawImage(FG,0,0);X.shadowBlur=2+a*18;X.globalAlpha=1;X.drawImage(FG,0,0);X.restore();return}if(mode==='rotation'){X.save();X.translate(C.width/2,C.height/2);X.rotate(a*.12);X.drawImage(FG,-C.width/2,-C.height/2);X.restore();return}if(mode==='solarize'){X.drawImage(FG,0,0);let im=X.getImageData(0,0,C.width,C.height),d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i]<128?255-d[i]:d[i];d[i+1]=d[i+1]<128?255-d[i+1]:d[i+1];d[i+2]=d[i+2]<128?255-d[i+2]:d[i+2]}X.putImageData(im,0,0);return}if(mode==='echo'){X.drawImage(FG,0,0);X.globalAlpha=a*.28;for(let i=1;i<=3;i++)X.drawImage(FG,(i*a*18)%30,(i*a*14)%30);X.globalAlpha=1;return}if(mode==='glitch'||mode==='warp'||mode==='ripple'){let step=Math.max(2,Math.floor(40/f)),amp=a*(mode==='glitch'?120:mode==='ripple'?80:45);for(let y=0;y<C.height;y+=step){let off=Math.sin(y/f*.8)*amp+(mode==='glitch'&&Math.random()<.18?(Math.random()-.5)*amp*2:0);X.drawImage(FG,0,y,C.width,Math.min(step,C.height-y),off,y,C.width,Math.min(step,C.height-y))}return}if(mode==='scatter'){X.drawImage(FG,0,0);let n=Math.floor(10+a*70);for(let i=0;i<n;i++){let x=Math.random()*C.width,y=Math.random()*C.height,w=20+Math.random()*80,h=10+Math.random()*50;X.drawImage(FG,x,y,w,h,x+(Math.random()-.5)*a*60,y+(Math.random()-.5)*a*60,w,h)}return}X.save();X.translate((Math.random()-.5)*a*40,(Math.random()-.5)*a*40);X.drawImage(FG,0,0);X.restore()}
function drawBackgroundTo(ctx){
 ctx.clearRect(0,0,C.width,C.height);
 const g=S.bg||{};
 if(g.mode==='solid'){ctx.fillStyle=g.colorA||'#101010';ctx.fillRect(0,0,C.width,C.height);return}
 const a=(g.angle||0)*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a);
 const cx=C.width/2,cy=C.height/2,len=Math.abs(C.width*dx)+Math.abs(C.height*dy);
 const grad=ctx.createLinearGradient(cx-dx*len/2,cy-dy*len/2,cx+dx*len/2,cy+dy*len/2);
 grad.addColorStop(0,g.colorA||'#101010');grad.addColorStop(1,g.colorB||'#5a416f');
 ctx.fillStyle=grad;ctx.fillRect(0,0,C.width,C.height);
}
function render(){normalizeState();drawBackgroundTo(B);Q.clearRect(0,0,C.width,C.height);Q.drawImage(BC,0,0);texture();drawForeground();X.clearRect(0,0,C.width,C.height);chaos();Q.drawImage(X,0,0);if(drawing&&pts.length>1)drawOn(Q,{points:pts,layerId:S.draw.activeLayer},true);CTX.clearRect(0,0,C.width,C.height);CTX.drawImage(Q.canvas,0,0)}
function point(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
C.onpointerdown=e=>{if(myRole!==6)return;drawing=true;pts=[point(e)];C.setPointerCapture(e.pointerId)};
C.onpointermove=e=>{if(!drawing)return;pts.push(point(e));scheduleRender()};
C.onpointerup=()=>{if(drawing){drawing=false;if(pts.length>1)send({type:'stroke',points:pts,layerId:S.draw.activeLayer});pts=[];render()}};
$('clear').onclick=()=>send({type:'clear'});
$('download').onclick=()=>{render();let a=document.createElement('a');a.download='kollektiv-poster.png';a.href=C.toDataURL('image/png');a.click()};

// Arkiv
function dna(){return {deltagare:currentPeople.length,rollbyten:0,kaos:Math.round((S.chaos?.amount||0)),textlager:S.textLayers.length,foton:S.photos.length,stickers:S.stickers.length,streck:(S.draw.layers||[]).reduce((n,l)=>n+(l.strokes||[]).length,0)}};
function saveArchive(){if(!ws||ws.readyState!==1){render();return}const image=C.toDataURL('image/jpeg',.82);const tc=document.createElement('canvas');tc.width=180;tc.height=240;tc.getContext('2d').drawImage(C,0,0,180,240);const thumb=tc.toDataURL('image/jpeg',.68);const title='Poster '+new Date().toLocaleString('sv-SE',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});send({type:'archiveSave',title,image,thumb,dna:dna()})}
function renderArchive(){const g=$('archiveGrid');if(!g)return;g.innerHTML='';if(!archiveItems.length){g.innerHTML='<div class="hint">Inga sparade affischer ännu.</div>';return}archiveItems.forEach(a=>{let b=document.createElement('button');b.className='archive-card';b.innerHTML='<span class="archive-thumb"></span><strong>'+esc(a.title)+'</strong><small>'+new Date(a.createdAt).toLocaleString('sv-SE')+'</small>';b.onclick=()=>send({type:'archiveGet',id:a.id});g.append(b);loadThumb(a,b.querySelector('.archive-thumb'))})}
function loadThumb(a,el){if(a.thumb)el.style.backgroundImage=`url(${a.thumb})`}
function showArchiveItem(a){const d=$('archiveDetail');d.classList.remove('hidden');const labels={deltagare:'Deltagare',rollbyten:'Rollbyten',kaos:'Kaos',textlager:'Textlager',foton:'Foton',stickers:'Stickers',streck:'Streck'};d.innerHTML='<button id="backArchive">← TILLBAKA</button><h3>'+esc(a.title)+'</h3><img src="'+a.image+'"><div class="dna">'+Object.entries(a.dna||{}).map(([k,v])=>'<span><b>'+esc(labels[k]||k)+'</b> '+esc(String(v))+'</span>').join('')+'</div>';d.querySelector('#backArchive').onclick=()=>{d.classList.add('hidden');renderArchive()}}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('saveArchive').onclick=saveArchive;
function openArchive(){const m=$('archiveModal');m.classList.remove('hidden');m.setAttribute('aria-hidden','false');$('archiveDetail').classList.add('hidden');send({type:'archiveList'})}
function closeArchive(){const m=$('archiveModal');m.classList.add('hidden');m.setAttribute('aria-hidden','true')}
$('openArchive').onclick=openArchive;
$('closeArchive').onclick=closeArchive;
$('archiveModal').addEventListener('click',e=>{if(e.target.id==='archiveModal')closeArchive()});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && !$('archiveModal').classList.contains('hidden'))closeArchive()});
// Camera
let camStream=null;
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia){return}
 const modal=document.createElement('div');modal.className='camera-modal';
 modal.innerHTML='<div class="camera-box"><video autoplay playsinline></video><div><button id="snap">TA BILD</button><button id="camClose">STÄNG</button></div></div>';
 document.body.append(modal);const v=modal.querySelector('video');
 try{camStream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=camStream}catch(e){modal.remove();return}
 modal.querySelector('#snap').onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth||900;c.height=v.videoHeight||1200;c.getContext('2d').drawImage(v,0,0,c.width,c.height);compressPhoto(c.toDataURL('image/jpeg',.85));closeCam(modal)};
 modal.querySelector('#camClose').onclick=()=>closeCam(modal);
}
function closeCam(m){camStream?.getTracks().forEach(t=>t.stop());camStream=null;m.remove()}
function filePhoto(f){if(!f)return;let r=new FileReader();r.onload=()=>compressPhoto(r.result);r.readAsDataURL(f)}
function compressPhoto(src){let im=new Image();im.onload=()=>{let max=1100,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));let c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);filePhotoData(c.toDataURL('image/jpeg',.82))};im.src=src}
function filePhotoData(src){const id=Date.now()+Math.floor(Math.random()*1000);S.photos.push({id,src,x:50,y:50,w:45,hScale:100,opacity:1,filter:'normal',tint:'#ffffff',tintOpacity:0,skewX:0,skewY:0,rotation:0});set('photos',S.photos)}
stat('OFFLINE');render();
</script></body></html>
