<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOLLEKTIV / POSTER</title>
<style>
:root{--bg:#101010;--panel:#171717;--line:#3b3b3b;--muted:#999;--fg:#eee;--accent:#d7ff38}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px/1.25 Arial,sans-serif}
body{overflow:hidden}.app{height:100vh;display:flex;gap:14px;padding:12px}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#0b0b0b;border:1px solid var(--line);position:relative}
#canvas{display:block;height:min(96vh,900px);width:auto;max-width:100%;background:#fff;cursor:crosshair;image-rendering:auto;touch-action:none}
.panel{width:330px;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:12px}
h1{font-size:15px;font-weight:700;letter-spacing:.08em;margin:0 0 4px}h2{font-size:11px;margin:15px 0 7px;color:#bbb;letter-spacing:.12em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}.row>*{min-width:0}.row label{width:92px;color:#aaa}
button,select,input[type=text],input[type=number]{background:#101010;color:#eee;border:1px solid #555;padding:6px 7px;font:inherit}
button{cursor:pointer}button:hover{border-color:#aaa}button.active{border-color:var(--accent);color:var(--accent)}
input[type=range]{width:100%}input[type=color]{width:42px;height:26px;padding:1px;background:#111;border:1px solid #555}
.modebar{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.modebar button{font-size:10px;padding:7px 3px}
.small{font-size:10px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.grid button{width:100%}
.value{width:34px;text-align:right;color:#aaa}.swatches{display:flex;gap:4px;flex-wrap:wrap}.swatches button{width:24px;height:24px;padding:0}
.library{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.library button{height:52px;font-size:22px}
#versions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.version{border:1px solid #444;padding:3px;cursor:pointer}.version canvas{width:100%;display:block}.version div{font-size:9px;color:#999}
.hidden{display:none!important}.danger{border-color:#744;color:#ff9b9b}.hint{color:#777;margin:5px 0}

/* V6 UI */
:root{--role:#d7ff38}
.panel{scrollbar-width:thin}
#controls{padding-top:2px}
.row{margin:7px 0}.row label{font-size:10px;letter-spacing:.05em}
.value{width:48px;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:700}
.reset-slider{width:22px;height:22px;padding:0;border-color:#3e3e3e;color:#777;font-size:12px}
.reset-slider:hover{color:var(--role);border-color:var(--role)}
.modebar button.active{border-color:var(--role);color:var(--role);box-shadow:inset 0 -2px 0 var(--role)}
.panel h2{border-top:1px solid #292929;padding-top:10px}
.object-list{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.object-list button{padding:5px 7px;font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.object-list button.active{border-color:var(--role);color:var(--role)}
#posterView{position:absolute;right:10px;top:10px;z-index:20;background:#101010cc;backdrop-filter:blur(4px)}
body.poster-only .panel{display:none}
body.poster-only .app{padding:0;gap:0}
body.poster-only .stage{border:0}
body.poster-only #canvas{height:min(100vh,1000px);max-width:100vw}
body.poster-only #posterView{position:fixed;right:14px;top:14px}
.role-tag{font-size:9px;color:var(--role);letter-spacing:.16em;margin:5px 0 2px}


/* MULTIPLAYER V1 */
#collectiveBox{border:1px solid #343434;padding:8px;margin:8px 0;background:#0d0d0d}
#collectiveStatus{font-size:10px;line-height:1.35;color:#aaa}#collectiveStatus strong{color:var(--role)}
#presence{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.person{border:1px solid #353535;padding:3px 5px;font-size:9px;color:#bbb}.person.me{border-color:var(--role);color:var(--role)}
#lobby{position:fixed;inset:0;z-index:1000;background:#080808f2;display:flex;align-items:center;justify-content:center;padding:20px}#lobby.hidden{display:none}
.lobby-card{width:min(460px,95vw);border:1px solid #555;background:#101010;padding:18px;box-shadow:0 30px 100px #000}.lobby-card h2{font-size:20px;margin:0 0 4px}.lobby-card p{font-size:11px;color:#999;line-height:1.45}
.room-code{font-family:monospace;letter-spacing:.18em;font-size:13px;color:var(--role)}#netDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#555;margin-right:5px}#netDot.on{background:#8dff43}


/* MULTIPLAYER V2 LOBBY */
#lobby{background:#090909}
.lobby-card{width:min(620px,95vw);padding:22px}
.lobby-title{font-size:32px!important;line-height:.95!important;letter-spacing:-.04em;margin-bottom:10px!important}
.lobby-sub{max-width:48ch;margin:0 0 18px!important}
.lobby-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.lobby-choice>div{border:1px solid #393939;padding:12px;background:#0c0c0c}
.lobby-choice h3{font-size:11px;letter-spacing:.12em;margin:0 0 8px;color:#bbb}
.lobby-choice button{width:100%;min-height:42px}
#joinCode{font-family:monospace;text-transform:uppercase;letter-spacing:.14em;font-size:16px;width:100%}
#joinName{width:100%}
#lobbyMsg{min-height:18px;margin-top:10px}
#lobbyMsg.error{color:#ff8b8b}
#lobbyMsg.ok{color:#baff78}
#serverState{display:flex;align-items:center;gap:6px;color:#777;font-size:10px;margin-top:12px}
#serverState .dot{width:7px;height:7px;border-radius:50%;background:#555}
#serverState.online .dot{background:#8dff43}
#serverState.error .dot{background:#ff4b4b}
.share-room{display:flex;gap:5px;align-items:center;margin-top:6px}
.share-room input{flex:1}
@media(max-width:650px){.lobby-choice{grid-template-columns:1fr}.lobby-title{font-size:26px!important}}


/* V4: enklare kollektiv UI */
#leftChat{position:fixed;left:12px;top:12px;width:170px;z-index:40;background:#0d0d0d;border:1px solid #353535;padding:8px}
#leftChat h3{font-size:10px;letter-spacing:.12em;margin:0 0 6px}
#chatFeed{height:104px;overflow:auto;border:1px solid #292929;background:#080808;padding:5px;margin-bottom:6px}
.chat-line{font-size:9px;line-height:1.35;margin-bottom:4px;color:#aaa}.chat-line b{color:#eee}
.chat-buttons{display:grid;grid-template-columns:1fr 1fr;gap:3px}.chat-buttons button{font-size:8px;padding:5px 2px}
#activity{font-size:9px;color:#aaa;min-height:13px;margin-top:5px}
#roleTools{border-top:1px solid #333;margin-top:7px;padding-top:7px}
#roleVoteStatus{font-size:9px;color:#bbb;margin-top:4px;min-height:13px}
#modes button.locked{opacity:.18;cursor:not-allowed}
#modes button.my-role{opacity:1;border-color:var(--role);box-shadow:inset 0 -2px 0 var(--role)}
#voteOverlay,#cameraOverlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9000;display:none;place-items:center}
#voteOverlay.show,#cameraOverlay.show{display:grid}
.modal-card{width:min(480px,92vw);background:#101010;border:1px solid #777;padding:16px}
.modal-card h2{margin:0 0 8px}
#cameraVideo{width:100%;max-height:65vh;background:#000;object-fit:contain;margin:8px 0}
@media(max-width:1050px){#leftChat{position:static;width:auto;margin:8px 8px 0}}


/* SIMPLE V1.1 — presentation-only simplification on stable V4 */
#modes{display:none!important}
aside{width:270px}
#controls h2{font-size:14px;margin:5px 0 12px}
#controls .hint{line-height:1.45}
#controls .reset-slider{display:none}
#controls .row{margin:10px 0}
#versions{display:none!important}
#leftChat{width:145px}
#chatFeed{height:68px}
.chat-buttons button:nth-child(3),
.chat-buttons button:nth-child(4){display:none}
#collectiveBox{padding:8px}
#simpleRoleHeader{font-size:9px;letter-spacing:.14em;color:#777;margin:5px 0 2px}
#simpleRoleName{font-size:18px;font-weight:900;color:var(--role);margin-bottom:10px}

</head>
<body>
<div id="leftChat">
  <h3>KOLLEKTIV CHAT</h3>
  <div id="chatFeed"></div>
  <div class="chat-buttons">
    <button data-chat="JAG ÄR NÖJD">NÖJD</button>
    <button data-chat="JAG ÄR INTE NÖJD">INTE NÖJD</button>
    <button data-chat="MER!">MER!</button>
    <button data-chat="MINDRE!">MINDRE!</button>
    <button data-chat="SPARA DEN HÄR">SPARA</button>
    <button data-chat="VÄNTA">VÄNTA</button>
  </div>
  <div id="activity"></div>
  <div id="roleTools">
    <button id="proposeRoles" style="width:100%">FÖRESLÅ ROLLBYTE</button>
    <div id="roleVoteStatus"></div>
  </div>
</div>

<div class="app">
  <main class="stage"><button id="posterView">VISA POSTER</button><canvas id="canvas" width="600" height="900"></canvas></main>
  <aside class="panel">
    <h1>KOLLEKTIV / POSTER</h1><div class="small">KOLLEKTIV VERSION · SIMPLE V1.1</div>
    <hr>
    <div class="modebar" id="modes">
      <button data-mode="background">BAKGRUND</button><button data-mode="texture">TEXTUR</button><button data-mode="stickers">STICKERS</button>
      <button data-mode="copy">COPYWRITER</button><button data-mode="font">TYPSNITT</button><button data-mode="draw">TECKNA</button>
      <button data-mode="paint">PAINTBRUSH</button><button data-mode="chaos">CHAOS</button><button data-mode="photo">FOTOGRAF</button>
    </div>
    <div id="collectiveBox">
      <div id="collectiveStatus"><span id="netDot"></span><strong id="roomLabel">SOLO / EJ ANSLUTEN</strong></div>
      <div id="presence"></div>
      <div class="grid" style="margin-top:6px"><button id="copyRoom">KOPIERA RUMSLÄNK</button><button id="leaveRoom">LÄMNA RUM</button></div>
    </div>
    <div id="simpleRoleHeader">DIN ROLL</div><div id="simpleRoleName">—</div><div id="controls"></div>
    <hr>
    <div class="grid"><button id="random">SLUMPA</button><button id="save">SPARA VERSION</button><button id="export">EXPORTERA PNG</button><button id="reset" class="danger">RESET</button></div>
    <h2>SPARADE VERSIONER</h2><div id="versions"></div>
  </aside>
</div>
<input id="photoInput" type="file" accept="image/*" multiple class="hidden">
<input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden">


<div id="voteOverlay"><div class="modal-card">
  <h2>BYTA ROLLER?</h2>
  <div id="voteText" class="hint">Alla måste godkänna. Ett NEJ avbryter.</div>
  <div class="grid" style="margin-top:10px"><button id="voteYes">JA</button><button id="voteNo" class="danger">NEJ</button></div>
</div></div>
<div id="cameraOverlay"><div class="modal-card">
  <h2>KAMERA</h2>
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div id="cameraMsg" class="hint"></div>
  <div class="grid"><button id="takePhoto">TA BILD</button><button id="closeCamera">STÄNG</button></div>
</div></div>
<div id="lobby">
  <div class="lobby-card">
    <h2 class="lobby-title">KOLLEKTIV<br>/ POSTER</h2>
    <p class="lobby-sub">En gemensam poster. Skapa ett nytt rum eller öppna ett rum som någon annan redan har startat.</p>

    <div class="row" style="display:block">
      <label style="display:block;width:auto;margin-bottom:5px">DITT NAMN</label>
      <input id="joinName" value="" maxlength="24" placeholder="SKRIV DITT NAMN">
    </div>

    <div class="lobby-choice">
      <div>
        <h3>STARTA</h3>
        <p class="hint">Skapa en ny poster och få en länk som du kan skicka till andra.</p>
        <button id="createRoom">SKAPA NYTT RUM</button>
      </div>
      <div>
        <h3>GÅ MED</h3>
        <input id="joinCode" maxlength="8" placeholder="RUMSKOD">
        <button id="joinExisting" style="margin-top:7px">GÅ MED I RUM</button>
      </div>
    </div>

    <div id="lobbyMsg" class="hint"></div>
    <div id="serverState"><span class="dot"></span><span>ANSLUTER TILL SERVERN…</span></div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const C=document.getElementById('canvas'),ctx=C.getContext('2d');
const W=C.width,H=C.height;
const socket=io({
 autoConnect:true,
 transports:['polling','websocket'],
 reconnection:true,
 reconnectionAttempts:Infinity,
 reconnectionDelay:500,
 reconnectionDelayMax:3000,
 timeout:12000
});
let roomCode=null,mySocketId=null,applyingRemote=false,syncTimer=null,lastSentJSON='',participants=[];
let assignedRole=null,currentVote=null,audioCtx=null,cameraStream=null,drawTool='pen',erasing=false;
let pendingRoom=(new URLSearchParams(location.search).get('room')||'').trim().toUpperCase();
let reconnectRoom=sessionStorage.getItem('kollektiv-room')||'';

function safeName(){
 const input=document.getElementById('joinName');
 const n=(input?.value||sessionStorage.getItem('kollektiv-name')||'').trim().slice(0,24);
 return n||'ANONYM';
}
function saveIdentity(){
 sessionStorage.setItem('kollektiv-name',safeName());
 if(roomCode)sessionStorage.setItem('kollektiv-room',roomCode);
}
function multiplayerActive(){return !!roomCode && socket.connected}
function lobbyMessage(msg,type=''){
 const el=document.getElementById('lobbyMsg');
 if(!el)return;
 el.textContent=msg||'';
 el.className='hint '+type;
}
function setServerState(kind,text){
 const el=document.getElementById('serverState');
 if(!el)return;
 el.className=kind||'';
 el.querySelector('span:last-child').textContent=text;
 const disabled=kind!=='online';
 document.getElementById('createRoom').disabled=disabled;
 document.getElementById('joinExisting').disabled=disabled;
}

const ROLE_LABELS={background:'BAKGRUND',texture:'TEXTUR',stickers:'STICKERS',copy:'COPYWRITER',font:'TYPSNITT',draw:'TECKNA',paint:'PAINTBRUSH',chaos:'CHAOS',photo:'FOTOGRAF'};
function primeAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function voteSound(){try{primeAudio();if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.frequency.setValueAtTime(620,n);o.frequency.setValueAtTime(820,n+.11);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.24);o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+.25)}catch(e){}}
function myPerson(){return participants.find(p=>p.id===mySocketId)}
function updateRoleLocks(){
 const me=myPerson();if(me?.role)assignedRole=me.role;
 document.querySelectorAll('#modes button').forEach(b=>{
  const mine=!multiplayerActive()||!assignedRole||b.dataset.mode===assignedRole;
  b.classList.toggle('locked',!mine);b.classList.toggle('my-role',multiplayerActive()&&b.dataset.mode===assignedRole);
 });
}
function addChat(msg){
 const f=document.getElementById('chatFeed');if(!f)return;
 const d=document.createElement('div');d.className='chat-line';
 const b=document.createElement('b');b.textContent=(msg.name||'ANONYM')+' · ';
 d.append(b,document.createTextNode(msg.phrase||''));f.appendChild(d);f.scrollTop=f.scrollHeight;
 while(f.children.length>10)f.firstChild.remove();
}
function showVote(v){
 currentVote=v||null;const ov=document.getElementById('voteOverlay'),st=document.getElementById('roleVoteStatus');
 if(!v){ov.classList.remove('show');st.textContent='';return}
 st.textContent=`${v.yes}/${v.total} HAR GODKÄNT`;
 const voted=(v.voters||[]).includes(mySocketId);
 document.getElementById('voteText').textContent=`${v.byName||'NÅGON'} VILL BYTA ROLLER · ${v.yes}/${v.total} JA`;
 ov.classList.toggle('show',!voted);
}

function scheduleRoomSync(){
 if(!multiplayerActive()||applyingRemote)return;
 clearTimeout(syncTimer);
 syncTimer=setTimeout(()=>{
   const payload=serializableState(),json=JSON.stringify(payload);
   if(json===lastSentJSON)return;
   lastSentJSON=json;
   socket.emit('state-update',{room:roomCode,state:payload,role:assignedRole||mode});
 },55);
}
function updatePresence(list=[]){
 participants=list;
 updateRoleLocks();
 const el=document.getElementById('presence');
 if(!el)return;
 el.innerHTML=list.map(p=>`<span class="person ${p.id===mySocketId?'me':''}">${esc(p.name||'ANONYM')} · ${esc(ROLE_LABELS[p.role]||p.role||'—')}</span>`).join('');
 updateRoleLocks();
}
function setRoomUI(){
 const dot=document.getElementById('netDot'),lab=document.getElementById('roomLabel');
 if(multiplayerActive()){
   dot.classList.add('on');
   lab.innerHTML=`RUM <span class="room-code">${esc(roomCode)}</span> · ${participants.length} ${participants.length===1?'PERSON':'PERSONER'}`;
 }else{
   dot.classList.remove('on');
   lab.textContent=roomCode?'ÅTERANSLUTER…':'EJ I RUM';
   if(!roomCode)document.getElementById('presence').innerHTML='';
 }
}
function enterRoom(res){
 roomCode=res.room;
 mySocketId=socket.id;
 saveIdentity();

 if(res.state){
   applyingRemote=true;
   Object.assign(state,res.state);
   normalizeState();
   hydratePhotos();
   applyingRemote=false;
 }
 lastSentJSON=JSON.stringify(serializableState());

 document.getElementById('lobby').classList.add('hidden');
 history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(roomCode));

 updatePresence(res.participants||[]);
 assignedRole=res.role||myPerson()?.role||assignedRole;
 setRoomUI();
 if(assignedRole)setMode(assignedRole,true);
 else{buildControls();render()}
 updateRoleLocks();
}
function joinRoom(code,{quiet=false}={}){
 code=(code||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
 if(!code){
   if(!quiet)lobbyMessage('Skriv en rumskod.','error');
   return;
 }
 if(!socket.connected){
   if(!quiet)lobbyMessage('Väntar på servern…','error');
   return;
 }
 if(!quiet)lobbyMessage('ÖPPNAR RUM '+code+'…');
 socket.timeout(10000).emit('join-room',{room:code,name:safeName()},(err,res)=>{
   if(err){
     if(!quiet)lobbyMessage('Servern svarade inte. Försök igen.','error');
     return;
   }
   if(!res?.ok){
     if(!quiet)lobbyMessage(res?.error||'Kunde inte gå med i rummet.','error');
     sessionStorage.removeItem('kollektiv-room');
     return;
   }
   enterRoom(res);
 });
}

let mode='paint', selectedSticker=-1, selectedText=-1, selectedPhoto=-1, drawing=false, activeStroke=null;
const palettes=['#f4f0df','#101010','#ff3355','#2f6bff','#d7ff38','#ff8a00','#8c4dff','#00d6a3','#f6c6ff','#ffffff'];
const drawingAssets=[
  {name:'häst',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><g fill="none" stroke="#111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M35 135 Q55 65 115 72 Q160 45 194 80 Q215 100 204 135 M70 82 L48 40 L77 56 M145 72 L165 38 L179 71 M78 133 L74 160 M174 130 L184 158"/><circle cx="178" cy="82" r="4" fill="#111"/><path d="M194 104 Q230 115 221 142"/></g></svg>`},
  {name:'figur',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="180" height="230"><g fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"><circle cx="90" cy="48" r="28"/><path d="M90 76 L90 155 M90 95 L35 125 M90 95 L145 120 M90 155 L48 210 M90 155 L135 210"/></g></svg>`},
  {name:'sol',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><circle cx="100" cy="100" r="48" fill="#111"/><g stroke="#111" stroke-width="8"><path d="M100 12V48M100 152v36M12 100h36M152 100h36M38 38l25 25M137 137l25 25M162 38l-25 25M63 137l-25 25"/></g></svg>`},
  {name:'öga',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="130"><path d="M12 65 Q120 0 228 65 Q120 130 12 65Z" fill="none" stroke="#111" stroke-width="8"/><circle cx="120" cy="65" r="27" fill="#111"/></svg>`},
  {name:'blixt',svg:`<svg xmlns="http://www.w3.org/2000/svg" width="170" height="230"><path d="M110 8 L25 122 H78 L58 222 L145 92 H94Z" fill="#111"/></svg>`}
];
const state={
 bg:{type:'gradient',c1:'#f4f0df',c2:'#ff3355',c3:'#2f6bff',colors:3,angle:25},
 texture:{type:'dots',opacity:14,scale:18,color:'#111'},
 stickers:[], texts:[{text:'KOLLEKTIV',x:300,y:100,size:58,color:'#101010',font:'Arial',w:1,h:1,skew:0,rot:0,shadow:false,shadowColor:'#000',blur:8,sx:6,sy:6}],
 strokes:[], photos:[], chaos:{glitch:0,warp:0,rgb:0,melt:0,echo:0,pixel:0,ripple:0,twist:0},
 draw:{size:22,opacity:100,color:'#101010'},
 paint:{material:'RUNDA',size:24,opacity:100,organic:0,swell:0,twist:0,sticky:0,jagged:0,color:'#101010'}
};
function clone(x){return JSON.parse(JSON.stringify(x))}
function serializableState(){
 return JSON.parse(JSON.stringify(state,(k,v)=>k==='img'?undefined:v));
}
function saveLocal(){
 try{
  localStorage.setItem('kollektiv-poster-v2',JSON.stringify(serializableState()));
 }catch(e){
  console.warn('Kunde inte autospara allt lokalt:',e);
 }
 scheduleRoomSync();
}
function loadLocal(){
 try{
  let x=JSON.parse(localStorage.getItem('kollektiv-poster-v2'));
  if(x)Object.assign(state,x);
 }catch(e){}
}
function normalizeState(){
 state.strokes=(state.strokes||[]).map(st=>{if(!st.color)st.color=state.draw?.color||'#101010';return st;});
 state.draw=state.draw||{
   size:state.paint?.size||22,
   opacity:state.paint?.opacity??100,
   color:state.paint?.color||'#101010'
 };
 state.draw.size??=22;state.draw.opacity??=100;state.draw.color??='#101010';

 state.paint=state.paint||{};
 const old=state.paint;
 if(old.swell==null && old.bloat!=null)old.swell=old.bloat;

 const bg=document.createElement('canvas');bg.width=W;bg.height=H;
 bg.getContext('2d').drawImage(C,0,0);

 // Layer order: photo -> drawings -> text -> stickers.
 for(const ph of state.photos)drawPhoto(ph);
 for(const st of state.strokes)renderStroke(st);
 for(const t of state.texts)drawText(t);
 for(const st of state.stickers)drawSticker(st);

   const full=document.createElement('canvas');full.width=W;full.height=H;

   ctx.clearRect(0,0,W,H);
   ctx.drawImage(bg,0,0);
   ctx.drawImage(chaotic,0,0);

}

 ctx.translate(-k*h/2,0);

   }
   processed=q;
 }

 // Tint is applied to the processed pixels.
 if((p.tintAmount||0)>0){
   const pc=processed.getContext('2d');
   pc.save();pc.globalCompositeOperation='source-atop';
   pc.globalAlpha=(p.tintAmount||0)/100;pc.fillStyle=p.tint||'#fff';
   pc.fillRect(0,0,ow,oh);pc.restore();
 }

 ctx.save();ctx.translate(p.x,p.y);ctx.rotate((p.rot||0)*Math.PI/180);
 ctx.globalAlpha=(p.opacity??100)/100;

 const sx=(p.distortX||0)/100, sy=(p.distortY||0)/100;
 if(Math.abs(sx)<.001 && Math.abs(sy)<.001){
   ctx.drawImage(processed,-w/2,-h/2,w,h);
 }else{
   // Cut the image into strips and independently shift/stretch them.
   const strip=Math.max(3,Math.round(14-Math.max(Math.abs(sx),Math.abs(sy))*9));
   if(Math.abs(sx)>=Math.abs(sy)){
     for(let yy=0;yy<oh;yy+=strip){
       const sh=Math.min(strip,oh-yy);
       const wave=Math.sin(yy*.071)+.55*Math.sin(yy*.019+1.7);
       const jump=wave*sx*w*.16;
       const stretch=1+Math.sin(yy*.043+2.2)*Math.abs(sx)*.22;
       ctx.drawImage(processed,0,yy,ow,sh,-w/2+jump,-h/2+(yy/oh)*h,w*stretch,(sh/oh)*h+1);
     }
   }else{
     for(let xx=0;xx<ow;xx+=strip){
       const sw=Math.min(strip,ow-xx);
       const wave=Math.sin(xx*.067)+.55*Math.sin(xx*.021+2.1);
       const jump=wave*sy*h*.16;
       const stretch=1+Math.sin(xx*.039+1.4)*Math.abs(sy)*.22;
       ctx.drawImage(processed,xx,0,sw,oh,-w/2+(xx/ow)*w,-h/2+jump,(sw/ow)*w+1,h*stretch);
     }
   }
 }
 ctx.restore();
}
function chaosTransform(sourceCanvas){
 const c=state.chaos;
 if(!c || !Object.values(c).some(v=>v>0))return sourceCanvas;

 // Work from a frozen snapshot. This avoids undefined self-drawing behaviour
 // and lets the effects chain in a predictable way.
 const A=document.createElement('canvas'),B=document.createElement('canvas');
 A.width=B.width=W;A.height=B.height=H;
 const a=A.getContext('2d'),b=B.getContext('2d');
 a.drawImage(sourceCanvas,0,0);
// Overscan edge pixels so displacement never reveals empty white bands.
const edge=140;
a.drawImage(sourceCanvas,0,0,1,H,0,0,edge,H);
a.drawImage(sourceCanvas,W-1,0,1,H,W-edge,0,edge,H);
a.drawImage(sourceCanvas,0,0,W,1,0,0,W,edge);
a.drawImage(sourceCanvas,0,H-1,W,1,0,H-edge,W,edge);

 let src=A,dst=B;
 const swap=()=>{const t=src;src=dst;dst=t};
 const clearDst=()=>{const d=dst.getContext('2d');d.setTransform(1,0,0,1,0,0);d.globalAlpha=1;d.globalCompositeOperation='source-over';d.filter='none';d.clearRect(0,0,W,H);d.imageSmoothingEnabled=true;return d};

 // WARP — broad elastic sideways bending of the whole poster.
 if(c.warp>0){
   const d=clearDst(),strength=c.warp/100;
   const band=6;
   for(let y=0;y<H;y+=band){
     const shift=Math.sin(y*.020+strength*2.1)*strength*62
                +Math.sin(y*.006+1.7)*strength*34;
     d.drawImage(src,0,y,W,band,shift,y,W,band);
   }
   swap();
 }

 // RIPPLE — denser wave distortion, visually distinct from WARP.
 if(c.ripple>0){
   const d=clearDst(),strength=c.ripple/100;
   const band=4;
   for(let y=0;y<H;y+=band){
     const shift=Math.sin(y*(.035+.025*strength))*strength*52;
     const scale=1+Math.sin(y*.019)*strength*.025;
     d.drawImage(src,0,y,W,band,shift-(W*(scale-1))/2,y,W*scale,band);
   }
   swap();
 }

 // MELT — vertical columns drag downward by different amounts.
 if(c.melt>0){
   const d=clearDst(),strength=c.melt/100;
   const col=7;
   for(let x=0;x<W;x+=col){
     const n=(Math.sin(x*.071)+Math.sin(x*.019+2.4)+2)/4;
     const drop=n*strength*280;
     d.drawImage(src,x,0,col,H,x,drop,col,H);
     // keep a faint original top so the result feels stretched rather than cut away
     d.globalAlpha=.18*strength;
     d.drawImage(src,x,0,col,H,x,0,col,H);
     d.globalAlpha=1;
   }
   swap();
 }

 // TWIST — tile-based rotational field around poster centre.
 if(c.twist>0){
   const d=clearDst(),strength=c.twist/100;
   const tile=36;
   const cx=W/2,cy=H/2,maxR=Math.hypot(cx,cy);
   for(let y=0;y<H;y+=tile){
     for(let x=0;x<W;x+=tile){
       const tw=Math.min(tile,W-x),th=Math.min(tile,H-y);
       const mx=x+tw/2,my=y+th/2;
       const r=Math.hypot(mx-cx,my-cy)/maxR;
       const angle=(1-r)*strength*.82*Math.sin((1-r)*Math.PI);
       d.save();
       d.translate(mx,my);
       d.rotate(angle);
       d.drawImage(src,x,y,tw,th,-tw/2-2,-th/2-2,tw+4,th+4);
       d.restore();
     }
   }
   swap();
 }

 // GLITCH — deterministic horizontal block jumps.
 if(c.glitch>0){
   const d=clearDst(),strength=c.glitch/100;
   d.drawImage(src,0,0);
   const bands=5+Math.floor(strength*22);
   for(let i=0;i<bands;i++){
     const y=Math.floor(rand(730000+i*37+c.glitch)*H);
     const h=3+Math.floor(rand(731000+i*41+c.glitch)*Math.max(5,32*strength));
     const dx=(rand(732000+i*43+c.glitch)-.5)*strength*220;
     d.drawImage(src,0,y,W,h,dx,y,W,h);
   }
   swap();
 }

 // PIXEL — true low-resolution downsample/upscale.
 if(c.pixel>0){
   const d=clearDst(),strength=c.pixel/100;
   const factor=Math.max(2,Math.floor(2+strength*24));
   const sw=Math.max(1,Math.floor(W/factor)),sh=Math.max(1,Math.floor(H/factor));
   const tiny=document.createElement('canvas');tiny.width=sw;tiny.height=sh;
   const t=tiny.getContext('2d');t.imageSmoothingEnabled=true;t.drawImage(src,0,0,sw,sh);
   d.imageSmoothingEnabled=false;
   d.drawImage(tiny,0,0,sw,sh,0,0,W,H);
   swap();
 }

 // RGB SHIFT — offset the actual colour channels.
 if(c.rgb>0){
   const d=clearDst(),strength=c.rgb/100;
   const sc=src.getContext('2d');
   const im=sc.getImageData(0,0,W,H),out=d.createImageData(W,H);
   const a=im.data,o=out.data;
   const shift=Math.max(1,Math.floor(strength*34));
   for(let y=0;y<H;y++){
     for(let x=0;x<W;x++){
       const i=(y*W+x)*4;
       const xr=Math.min(W-1,x+shift),xb=Math.max(0,x-shift);
       const ir=(y*W+xr)*4, ib=(y*W+xb)*4;
       o[i]=a[ir];
       o[i+1]=a[i+1];
       o[i+2]=a[ib+2];
       o[i+3]=a[i+3];
     }
   }
   d.putImageData(out,0,0);
   swap();
 }

 // ECHO — repeated translucent copies that trail diagonally.
 if(c.echo>0){
   const d=clearDst(),strength=c.echo/100;
   d.drawImage(src,0,0);
   for(let i=1;i<=5;i++){
     d.globalAlpha=strength*(.17/i);
     d.drawImage(src,i*10*strength,i*7*strength);
   }
   d.globalAlpha=1;
   swap();
 }

 return src;
}

function extractForeground(fullCanvas,bgCanvas){
 const fg=document.createElement('canvas');fg.width=W;fg.height=H;
 const fc=fg.getContext('2d',{willReadFrequently:true});
 const full=fullCanvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H);
 const bg=bgCanvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H);
 const out=fc.createImageData(W,H);
 const a=full.data,b=bg.data,o=out.data;
 for(let i=0;i<a.length;i+=4){
   const d=Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]),Math.abs(a[i+3]-b[i+3]));
   if(d>2){
     o[i]=a[i];o[i+1]=a[i+1];o[i+2]=a[i+2];
     o[i+3]=Math.min(255,Math.max(a[i+3],d*3));
   }
 }
 fc.putImageData(out,0,0);
 return fg;
}

function neutralValue(key,obj,min,max){
 if(key==='h'||key==='w')return 1;
 if(['skew','rot','shadow','organic','swell','twist','sticky','jagged','glitch','warp','rgb','melt','echo','pixel','ripple','tintAmount','distortX','distortY','angle'].includes(key))return 0;
 if(key==='opacity')return 100;
 if(key==='x')return W/2;
 if(key==='y')return H/2;
 if(key==='size')return Math.max(min,Math.min(max,100));
 if(key==='scale')return Math.max(min,Math.min(max,18));
 return min;
}

 el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state.stickers.push({kind:b.dataset.add,x:300,y:350,size:100,rot:0,opacity:100,color:palettes[Math.floor(Math.random()*palettes.length)]});selectedSticker=state.stickers.length-1;saveLocal();buildControls();render()});
 el.querySelectorAll('[data-drawing]').forEach(b=>b.onclick=()=>{let a=drawingAssets[+b.dataset.drawing],obj={kind:'drawing',x:300,y:400,size:180,rot:0,opacity:100,color:'#111',src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(a.svg)};state.stickers.push(obj);selectedSticker=state.stickers.length-1;saveLocal();buildControls();render()});
 if(q('delSticker'))q('delSticker').onclick=()=>{state.stickers.splice(selectedSticker,1);selectedSticker=-1;saveLocal();buildControls();render()};
 if(q('addText'))q('addText').onclick=()=>{state.texts.push({text:'NY TEXT',x:300,y:200,size:52,color:'#111',font:'Arial',w:1,h:1,skew:0,rot:0,shadow:0,shadowColor:'#000',blur:8,sx:6,sy:6});selectedText=state.texts.length-1;saveLocal();buildControls();render()}
if(q('fontFamily')){
 const ti=selectedText>=0?selectedText:0;
 if(state.texts[ti]){

  q('fontFamily').onchange=()=>{

 if(q('textValue'))q('textValue').oninput=()=>{state.texts[selectedText].text=q('textValue').value;saveLocal();render()};
 if(q('delText'))q('delText').onclick=()=>{state.texts.splice(selectedText,1);selectedText=-1;saveLocal();buildControls();render()};
if(q('photoFilter')){
 q('photoFilter').value=state.photos[selectedPhoto]?.filter||'ingen';
 q('photoFilter').onchange=()=>{

if(q('delPhoto'))q('delPhoto').onclick=()=>{

if(q('chaosNormal'))q('chaosNormal').onclick=()=>{

async function openCamera(){
 const ov=document.getElementById('cameraOverlay'),msg=document.getElementById('cameraMsg');
 ov.classList.add('show');msg.textContent='ÖPPNAR KAMERA…';primeAudio();
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera-API saknas');
  cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  document.getElementById('cameraVideo').srcObject=cameraStream;msg.textContent='';
 }catch(e){
  msg.textContent='KAMERAN BLOCKERADES. Tillåt kamera i webbläsaren eller använd IMPORTERA FOTON.';
 }
}
function closeCamera(){
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
 document.getElementById('cameraVideo').srcObject=null;document.getElementById('cameraOverlay').classList.remove('show');
}
function addPhotoData(data,w,h){
 const im=new Image();im.onload=()=>{
  const fit=Math.min(450/im.width,500/im.height,1);
  state.photos.push({src:data,img:im,x:W/2,y:H/2,w:im.width*fit,h:im.height*fit,rot:0,opacity:100,tint:'#ffffff',tintAmount:0,distortX:0,distortY:0,filter:'ingen',filterSize:8});
  selectedPhoto=state.photos.length-1;saveLocal();buildControls();render();
 };im.src=data;
}
document.getElementById('takePhoto').onclick=()=>{
 const v=document.getElementById('cameraVideo');if(!v.videoWidth)return;
 const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
 c.getContext('2d').drawImage(v,0,0);addPhotoData(c.toDataURL('image/jpeg',.86),c.width,c.height);closeCamera();
};
document.getElementById('closeCamera').onclick=closeCamera;

function addPhotos(files){
 [...files].forEach(file=>{
  if(!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=()=>{
   const original=new Image();
   original.onload=()=>{
    // Resize large camera files before storing them in localStorage.
    const maxSide=1200;
    const scale=Math.min(1,maxSide/Math.max(original.width,original.height));
    const rw=Math.max(1,Math.round(original.width*scale));
    const rh=Math.max(1,Math.round(original.height*scale));
    const temp=document.createElement('canvas');temp.width=rw;temp.height=rh;
    const tc=temp.getContext('2d');tc.drawImage(original,0,0,rw,rh);
    let data;
    try{data=temp.toDataURL('image/jpeg',.86)}catch(e){data=reader.result}

    const im=new Image();
    im.onload=()=>{
     const fit=Math.min(450/im.width,500/im.height,1);
     state.photos.push({
      src:data,img:im,x:W/2,y:H/2,
      w:im.width*fit,h:im.height*fit,
      rot:0,opacity:100,
      tint:'#ffffff',tintAmount:0,
      distortX:0,distortY:0,
      filter:'ingen',filterSize:8
     });
     selectedPhoto=state.photos.length-1;
     saveLocal();buildControls();render();
    };
    im.src=data;
   };
   original.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}
document.getElementById('photoInput').onchange=e=>{addPhotos(e.target.files);e.target.value=''};
document.getElementById('cameraInput').onchange=e=>{addPhotos(e.target.files);e.target.value=''};

function point(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function eraseAt(p,r=28){
 const rr=r*r,next=[];
 for(const st of state.strokes){
  const pts=st.points||[];let seg=[];
  for(const q of pts){
   const hit=(q.x-p.x)*(q.x-p.x)+(q.y-p.y)*(q.y-p.y)<=rr;
   if(hit){if(seg.length>1)next.push({...st,points:seg});seg=[]}
   else seg.push(q);
  }
  if(seg.length>1)next.push({...st,points:seg});
 }
 state.strokes=next;render();
}
C.onpointerdown=e=>{if(mode==='draw'){
 C.setPointerCapture(e.pointerId);let p=point(e);
 if(drawTool==='eraser'){erasing=true;eraseAt(p);return}
 drawing=true;activeStroke={points:[p],color:state.draw.color,size:state.draw.size,opacity:state.draw.opacity,seed:1701+Math.floor(Math.random()*100000000)};
 state.strokes.push(activeStroke);render()
}};
C.onpointermove=e=>{
 if(mode==='draw'&&erasing){eraseAt(point(e));return}
 if(drawing&&activeStroke){activeStroke.points.push(point(e));render()}
};
C.onpointerup=()=>{if(drawing||erasing){drawing=false;erasing=false;activeStroke=null;saveLocal()}};
C.onpointerleave=()=>{if(drawing||erasing){drawing=false;erasing=false;activeStroke=null;saveLocal()}};




document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{primeAudio();if(multiplayerActive())socket.emit('quick-chat',{room:roomCode,phrase:b.dataset.chat})});
document.getElementById('proposeRoles').onclick=()=>{primeAudio();if(multiplayerActive())socket.emit('propose-role-shuffle',{room:roomCode})};
document.getElementById('voteYes').onclick=()=>{if(currentVote)socket.emit('role-vote',{room:roomCode,yes:true});document.getElementById('voteOverlay').classList.remove('show')};
document.getElementById('voteNo').onclick=()=>{if(currentVote)socket.emit('role-vote',{room:roomCode,yes:false});document.getElementById('voteOverlay').classList.remove('show')};
socket.on('quick-chat',addChat);

 primeAudio();
 if(!socket.connected){lobbyMessage('Väntar på servern…','error');return}
 saveIdentity();
 lobbyMessage('SKAPAR RUM…');

 try{
   await navigator.clipboard.writeText(url);

 if(roomCode)socket.emit('leave-room');
 roomCode=null;participants=[];

 history.replaceState(null,'',location.pathname);

socket.on('connect',()=>{
 mySocketId=socket.id;
 setServerState('online','SERVERN ÄR ANSLUTEN');
 setRoomUI();

 // Shared links are pre-filled instead of silently entering as ANONYM.
 if(pendingRoom){
   document.getElementById('joinCode').value=pendingRoom;
   lobbyMessage('RUM '+pendingRoom+' ÄR REDO — SKRIV DITT NAMN OCH GÅ MED.','ok');
   pendingRoom='';
 }else if(roomCode){
   // Network reconnect while already inside a room.
   joinRoom(roomCode,{quiet:true});
 }else if(reconnectRoom && document.getElementById('lobby').classList.contains('hidden')){
   joinRoom(reconnectRoom,{quiet:true});
 }
});
socket.on('connect_error',err=>{
 console.warn('socket connect_error',err);
 setServerState('error','KAN INTE NÅ SERVERN');
 lobbyMessage('Servern kunde inte nås. Den här multiplayer-versionen måste öppnas från den deployade Node/Render-adressen — inte som en lokal HTML-fil.','error');
 setRoomUI();
});
socket.on('disconnect',()=>{
 setServerState('','ÅTERANSLUTER TILL SERVERN…');
 setRoomUI();
});
socket.on('presence',list=>{updatePresence(list);setRoomUI()});
socket.on('room-state',payload=>{
 if(!payload?.state||payload.room!==roomCode)return;
 applyingRemote=true;
 Object.assign(state,payload.state);
 normalizeState();

 lastSentJSON=JSON.stringify(serializableState());
 applyingRemote=false;

document.getElementById('posterView').onclick=()=>{

};

document.getElementById('random').onclick=()=>{
 const rr=(a,b)=>a+Math.random()*(b-a);
 if(mode==='background'){
   state.bg.c1=palettes[Math.floor(Math.random()*palettes.length)];
   state.bg.c2=palettes[Math.floor(Math.random()*palettes.length)];
   state.bg.c3=palettes[Math.floor(Math.random()*palettes.length)];
   state.bg.angle=Math.round(rr(0,360));
 }else if(mode==='texture'){
   state.texture.opacity=Math.round(rr(6,28));
   state.texture.scale=Math.round(rr(8,30));
 }else if(mode==='stickers'){
   state.stickers.forEach(o=>{o.rot=Math.round(rr(-35,35));o.opacity=Math.round(rr(70,100))});
 }else if(mode==='copy'){
   // Copywriter owns size; keep it readable and do not move text.
   state.texts.forEach(t=>t.size=Math.round(rr(34,82)));
 }else if(mode==='font'){
   const fonts=['Impact','Arial Black','Arial Narrow','Courier New','Georgia','Times New Roman','Trebuchet MS','Verdana','Lucida Console','Palatino Linotype','Garamond','Bookman Old Style','Century Gothic','Franklin Gothic Medium','Brush Script MT','Comic Sans MS','Copperplate','Rockwell','Futura','Gill Sans','American Typewriter'];
   state.texts.forEach(t=>{t.font=fonts[Math.floor(Math.random()*fonts.length)];t.h=rr(.72,1.35);t.w=rr(.72,1.35);t.skew=rr(-.22,.22);t.rot=rr(-10,10);t.shadow=Math.round(rr(0,45))});
 }else if(mode==='paint'){
   state.paint.organic=Math.round(rr(0,70));state.paint.jagged=Math.round(rr(0,55));state.paint.twist=Math.round(rr(0,65));state.paint.swell=Math.round(rr(0,65));state.paint.sticky=Math.round(rr(0,60));
 }else if(mode==='chaos'){
   Object.keys(state.chaos).forEach(k=>state.chaos[k]=Math.round(rr(0,68)));
 }else if(mode==='photo' && selectedPhoto>=0){
   const p=state.photos[selectedPhoto];p.rot=Math.round(rr(-12,12));p.distortX=Math.round(rr(-28,28));p.distortY=Math.round(rr(-28,28));p.tintAmount=Math.round(rr(0,28));
 }
 saveLocal();buildControls();render();
};
document.getElementById('save').onclick=()=>{
 let versions=JSON.parse(localStorage.getItem('kollektiv-versions-v2')||'[]');versions.unshift({time:new Date().toLocaleString('sv-SE'),state:serializableState()});versions=versions.slice(0,9);localStorage.setItem('kollektiv-versions-v2',JSON.stringify(versions));showVersions();
};
document.getElementById('reset').onclick=()=>{
 // TOTAL RESET: clear current poster, saved versions and persisted state.
 localStorage.removeItem('kollektiv-poster-v2');
 localStorage.removeItem('kollektiv-versions-v2');

 state.bg={type:'solid',c1:'#ffffff',c2:'#ffffff',c3:'#ffffff',colors:1,angle:0};
 state.texture={type:'none',opacity:0,scale:18,color:'#111111'};
 state.stickers=[];
 state.texts=[];
 state.strokes=[];
 state.photos=[];
 state.chaos={glitch:0,warp:0,rgb:0,melt:0,echo:0,pixel:0,ripple:0,twist:0};
 state.draw={size:22,opacity:100,color:'#101010'};
 state.paint={material:'RUNDA',size:24,opacity:100,organic:0,swell:0,twist:0,sticky:0,jagged:0,color:'#101010'};

 selectedSticker=-1;selectedText=-1;selectedPhoto=-1;
 drawing=false;activeStroke=null;

 // Keep the reset blank state as the new local state.
 saveLocal();
 buildControls();
 showVersions();
 render();
};

function offerPngDownload(dataUrl){
 let box=document.getElementById('pngDownloadBox');
 if(!box){
   box=document.createElement('div');
   box.id='pngDownloadBox';
   box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:grid;place-items:center;padding:24px';
   box.innerHTML=`<div style="background:#171717;border:1px solid #555;padding:16px;max-width:560px;width:min(560px,92vw);font-family:Arial,sans-serif;color:#fff">
     <div style="font-weight:800;margin-bottom:10px">PNG ÄR KLAR</div>
     <img id="pngPreview" alt="PNG preview" style="display:block;width:100%;max-height:65vh;object-fit:contain;background:#fff;margin-bottom:12px">
     <div style="display:flex;gap:8px">
       <a id="pngRealDownload" download="kollektiv-poster.png" style="flex:1;text-align:center;padding:12px;background:#fff;color:#111;text-decoration:none;font-weight:800">LADDA NER PNG</a>
       <button id="pngClose" style="padding:12px;border:1px solid #777;background:#222;color:#fff">STÄNG</button>
     </div>
   </div>`;
   document.body.appendChild(box);
   box.querySelector('#pngClose').onclick=()=>box.remove();
 }
 box.querySelector('#pngPreview').src=dataUrl;
 box.querySelector('#pngRealDownload').href=dataUrl;
}
document.getElementById('export').onclick=()=>{
 setMode(mode);

 try{
   const dataUrl=C.toDataURL('image/png');
   const a=document.createElement('a');
   a.href=dataUrl;
   a.download='kollektiv-poster.png';
   a.style.display='none';
   document.body.appendChild(a);
   a.click();
   a.remove();

   // Always also expose a real clickable download link/preview.
   // This makes export work even when the browser blocks scripted downloads.
   offerPngDownload(dataUrl);
 }catch(err){
   console.error(err);
   alert('PNG kunde inte skapas i den här webbläsaren.');
 }
};
function showVersions(){let v=JSON.parse(localStorage.getItem('kollektiv-versions-v2')||'[]'),el=document.getElementById('versions');el.innerHTML='';v.forEach((x,i)=>{let d=document.createElement('div');d.className='version';let c=document.createElement('canvas');c.width=60;c.height=90;d.append(c,document.createElement('div'));d.lastChild.textContent=x.time;c.getContext('2d').drawImage(C,0,0,60,90);d.onclick=()=>{Object.assign(state,clone(x.state));saveLocal();buildControls();render()};el.append(d)})}
showVersions();setMode('paint');
</script>
