<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOLLEKTIV POSTER 3.6</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><div class="logo">KOLLEKTIV / POSTER_3.6</div><div class="tiny">NINE PEOPLE · ONE IMAGE · LIVE</div></div><div id="status" class="status">OFFLINE</div></header>
<main>
<section class="entry panel"><label>ROOM</label><input id="room" value="MAIN"><button id="enter">ENTER ROOM</button><span id="role">ROLL: —</span></section>
<section class="workspace">
<div class="poster-wrap"><canvas id="poster" width="900" height="1200"></canvas></div>
<aside class="side">
<div class="panel"><div class="section-title">DIN ROLL</div><div id="controls"></div></div>
<div class="panel"><div class="section-title">DELTAGARE / ROLLBYTE</div><div id="people"></div><div id="proposal" class="proposal hidden"></div></div>
<div class="panel chat-panel"><div class="section-title">CHAT</div><div id="chat"></div><div class="chatrow"><input id="chatInput" placeholder="skriv meddelande..."><button id="chatSend">SKICKA</button></div></div>
<div class="panel"><button id="download">↓ LADDA NER PNG</button><button id="clear" class="hidden">RENSA TECKNING</button></div>
</aside></section></main>
<script>
const C=document.getElementById('poster'),X=C.getContext('2d'),SC=document.createElement('canvas');SC.width=C.width;SC.height=C.height;const Q=SC.getContext('2d'),$=id=>document.getElementById(id);
let ws=null,myId=null,myRole=null,pendingRoom=null,activeRoom=null,currentPeople=[],proposal=null,drawing=false,pts=[],reconnectTimer=null,heartbeatTimer=null;
const roles={1:'BAKGRUND',2:'TEXTUR',3:'STICKERS',4:'COPYWRITER',5:'TYPSNITT',6:'TECKNA',7:'PAINTBRUSH',8:'CHAOS',9:'FOTOGRAF'};
let S={bg:{mode:'gradient',colorA:'#101010',colorB:'#5a416f',angle:135},texture:{type:'noise',opacity:.1,color:'#fff',scale:18},stickers:[],textLayers:[{id:1,value:'COLLECTIVE SIGNAL',x:50,y:15,color:'#fff',size:42,shadow:true,font:'Arial',weight:'700',height:100,width:100,skew:0}],type:{font:'Arial',weight:'700',height:100,width:100,skew:0},draw:{color:'#fff',strokes:[]},brush:{size:8,opacity:.8,type:'soft',jitter:0,spacing:1},chaos:{amount:0,mode:'glitch',frequency:5},photos:[]};
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}
function stat(s){$('status').textContent=s;$('status').className='status '+s.toLowerCase()}
function connect(){
 if(ws&&(ws.readyState===0||ws.readyState===1))return;
 const proto=location.protocol==='https:'?'wss:':'ws:';stat('CONNECTING');
 ws=new WebSocket(proto+'//'+location.host+'/ws');
 ws.onopen=()=>{stat('ONLINE');clearTimeout(reconnectTimer);if(heartbeatTimer)clearInterval(heartbeatTimer);heartbeatTimer=setInterval(()=>send({type:'ping'}),15000);if(pendingRoom){send({type:'join',room:pendingRoom});pendingRoom=null}};
 ws.onclose=()=>{if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null}stat('OFFLINE');myRole=null;$('role').textContent='ROLL: —';renderPeople([]);if(activeRoom){pendingRoom=activeRoom;clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,2500)}};
 ws.onerror=()=>stat('ERROR');
 ws.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.type==='hello'){myId=m.clientId;m.roles?.forEach(r=>roles[r.id]=r.name)}
  if(m.type==='joined'){myRole=m.role;S=m.state;currentPeople=m.clients||[];proposal=m.proposal;apply();renderPeople(currentPeople);showProposal(proposal)}
  if(m.type==='presence'){currentPeople=m.clients||[];renderPeople(currentPeople);if(proposal)showProposal(proposal)}
  if(m.type==='roleChanged'){myRole=m.role;currentPeople=m.clients||currentPeople;apply();renderPeople(currentPeople);addChat('SYSTEM: rollerna har bytts.')}
  if(m.type==='roleProposal'){proposal=m.proposal;showProposal(proposal)}
  if(m.type==='pong'){stat('ONLINE')}
  if(m.type==='state'){S[m.key]=m.value;build();render()}
  if(m.type==='stroke'){S.draw.strokes.push(m.stroke);render()}
  if(m.type==='clear'){S.draw.strokes=[];render()}
  if(m.type==='chat')addChat('P'+m.from+' · '+(roles[m.role]||'—')+': '+m.text)
 };
}
$('enter').onclick=()=>{activeRoom=$('room').value.trim()||'MAIN';pendingRoom=activeRoom;connect();if(ws?.readyState===1){send({type:'join',room:activeRoom});pendingRoom=null}};
function apply(){$('role').textContent='ROLL: '+(roles[myRole]||'SPEKTATOR');$('clear').classList.toggle('hidden',myRole!==6);build();render()}
function set(k,v){S[k]=v;send({type:'set',key:k,value:v});build();render()}
function ctrl(l,n){let r=document.createElement('label');r.className='ctrl';let s=document.createElement('span');s.textContent=l;r.append(s,n);$('controls').append(r);return r}
function rng(o,p,l,a,b,st,fn){let w=document.createElement('div'),i=document.createElement('input');w.className='slider';i.type='range';i.min=a;i.max=b;i.step=st;i.value=o[p]??a;let z=document.createElement('b');z.textContent=i.value;i.oninput=()=>{z.textContent=i.value;fn(+i.value)};w.append(i,z);ctrl(l,w)}
function col(o,p,l,fn){let i=document.createElement('input');i.type='color';i.value=o[p]||'#ffffff';i.oninput=()=>fn(i.value);ctrl(l,i)}
function sel(o,p,l,opts,fn){let i=document.createElement('select');opts.forEach(v=>{let q=document.createElement('option');q.value=v;q.textContent=v;i.append(q)});i.value=o[p]??opts[0];i.onchange=()=>fn(i.value);ctrl(l,i)}
function textInput(value,fn){let i=document.createElement('input');i.value=value;i.onchange=()=>fn(i.value);return i}
function build(){
 const q=$('controls');q.innerHTML='';if(!myRole)return;
 if(myRole===1){sel(S.bg,'mode','MODE',['gradient','solid'],v=>set('bg',{...S.bg,mode:v}));col(S.bg,'colorA','FÄRG',v=>set('bg',{...S.bg,colorA:v}));if(S.bg.mode==='gradient')col(S.bg,'colorB','GRADIENT B',v=>set('bg',{...S.bg,colorB:v}));rng(S.bg,'angle','VINKEL',0,360,1,v=>set('bg',{...S.bg,angle:v}))}
 if(myRole===2){sel(S.texture,'type','TEXTUR',['noise','dots','lines','grid','cross','waves','rings','hatch','speckle','grain','scribble','bubbles','none'],v=>set('texture',{...S.texture,type:v}));col(S.texture,'color','FÄRG',v=>set('texture',{...S.texture,color:v}));rng(S.texture,'opacity','OPACITY',0,1,.01,v=>set('texture',{...S.texture,opacity:v}));rng(S.texture,'scale','SKALA',4,80,1,v=>set('texture',{...S.texture,scale:v}))}
 if(myRole===3){['star','heart','circle','square'].forEach(s=>{let b=document.createElement('button');b.textContent='+ '+s.toUpperCase();b.onclick=()=>send({type:'addSticker',shape:s});q.append(b)});S.stickers.forEach(s=>{let d=document.createElement('div');d.className='item';d.append(document.createTextNode(s.shape.toUpperCase()));col(s,'color','FÄRG',v=>{s.color=v;set('stickers',S.stickers)});rng(s,'size','STORLEK',10,400,1,v=>{s.size=v;set('stickers',S.stickers)});rng(s,'x','X',0,100,1,v=>{s.x=v;set('stickers',S.stickers)});rng(s,'y','Y',0,100,1,v=>{s.y=v;set('stickers',S.stickers)});let b=document.createElement('button');b.textContent='TA BORT';b.onclick=()=>send({type:'removeSticker',id:s.id});d.append(b);q.append(d)})}
 if(myRole===4){let b=document.createElement('button');b.textContent='+ NYTT TEXTLAGER';b.onclick=()=>send({type:'addText'});q.append(b);S.textLayers.forEach(t=>{let d=document.createElement('div');d.className='item';d.append(textInput(t.value,v=>{t.value=v;set('textLayers',S.textLayers)}));col(t,'color','FÄRG',v=>{t.color=v;set('textLayers',S.textLayers)});rng(t,'size','STORLEK',8,180,1,v=>{t.size=v;set('textLayers',S.textLayers)});rng(t,'x','X',0,100,1,v=>{t.x=v;set('textLayers',S.textLayers)});rng(t,'y','Y',0,100,1,v=>{t.y=v;set('textLayers',S.textLayers)});let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!t.shadow;c.onchange=()=>{t.shadow=c.checked;set('textLayers',S.textLayers)};l.append(c,document.createTextNode(' DROP SHADOW'));d.append(l);let z=document.createElement('button');z.textContent='TA BORT';z.onclick=()=>send({type:'removeText',id:t.id});d.append(z);q.append(d)})}
 if(myRole===5){q.insertAdjacentHTML('beforeend','<div class="hint">Välj textlager och ändra typografin för just det lagret.</div>');S.textLayers.forEach((t,i)=>{let d=document.createElement('div');d.className='item';d.append(document.createTextNode('TEXT '+(i+1)+' · '+(t.value||'')));sel(t,'font','TYPSNITT',['Arial','Times New Roman','Times Bold','Old English','Helvetica','Futura'],v=>{t.font=v;set('textLayers',S.textLayers)});sel(t,'weight','VIKT',['400','700','900'],v=>{t.weight=v;set('textLayers',S.textLayers)});rng(t,'height','HÖJD',50,180,1,v=>{t.height=v;set('textLayers',S.textLayers)});rng(t,'width','BREDD',50,180,1,v=>{t.width=v;set('textLayers',S.textLayers)});rng(t,'skew','LUTNING',-45,45,1,v=>{t.skew=v;set('textLayers',S.textLayers)});q.append(d)})}
 if(myRole===6){col(S.draw,'color','PENNFÄRG',v=>set('draw',{...S.draw,color:v}));let n=document.createElement('div');n.className='hint';n.textContent='RITA DIREKT PÅ POSTERN';q.append(n)}
 if(myRole===7){sel(S.brush,'type','PENSA',['soft','hard','ink','dry','marker'],v=>set('brush',{...S.brush,type:v}));rng(S.brush,'size','TJOCKLEK',1,100,1,v=>set('brush',{...S.brush,size:v}));rng(S.brush,'opacity','OPACITY',0,1,.01,v=>set('brush',{...S.brush,opacity:v}));rng(S.brush,'jitter','JITTER',0,100,1,v=>set('brush',{...S.brush,jitter:v}));rng(S.brush,'spacing','BEHAVIOR',1,20,1,v=>set('brush',{...S.brush,spacing:v}))}
 if(myRole===8){sel(S.chaos,'mode','FILTER',['glitch','ripple','warp','jitter','rotation','scatter','solarize','echo'],v=>set('chaos',{...S.chaos,mode:v}));rng(S.chaos,'amount','AMOUNT',0,100,1,v=>set('chaos',{...S.chaos,amount:v}));rng(S.chaos,'frequency','FREQUENCY',1,30,1,v=>set('chaos',{...S.chaos,frequency:v}));let h=document.createElement('div');h.className='hint';h.textContent='CHAOS påverkar hela bilden.';q.append(h)}
 if(myRole===9){let b=document.createElement('button');b.textContent='📷 ÖPPNA KAMERA';b.onclick=openCamera;q.append(b);let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>filePhoto(i.files[0]);ctrl('BILDFIL',i);S.photos.forEach(p=>{rng(p,'w','STORLEK',10,100,1,v=>{p.w=v;set('photos',S.photos)});rng(p,'x','X',0,100,1,v=>{p.x=v;set('photos',S.photos)});rng(p,'y','Y',0,100,1,v=>{p.y=v;set('photos',S.photos)})})}
}
function renderPeople(list){
 currentPeople=list||[];let e=$('people');e.innerHTML='';
 currentPeople.forEach(p=>{let d=document.createElement('div');d.className='person '+(p.id===myId?'you':'');d.textContent='P'+p.id+' · '+(roles[p.role]||'SPEKTATOR')+(p.id===myId?' · DU':'');e.append(d)});
 let wrap=document.createElement('div');wrap.className='role-switch';
 let s=document.createElement('select');
 Object.entries(roles).forEach(([id,n])=>{let holder=currentPeople.find(p=>p.role===+id);let o=document.createElement('option');o.value=id;o.textContent=holder?'↔ '+id+' · '+n+' (P'+holder.id+')':'○ '+id+' · '+n+' (LEDIG)';if(+id===myRole)o.selected=true;s.append(o)});
 let b=document.createElement('button');b.textContent=proposal?'ROLLBYTE PÅGÅR':'BEGÄR ROLLBYTE';b.disabled=!!proposal;
 b.onclick=()=>{let target=+s.value;if(target===myRole)return;let holder=currentPeople.find(p=>p.role===target);if(holder&&!myRole){addChat('SYSTEM: du måste ha en roll för att byta med någon.');return}send({type:'roleRequest',requestedRole:target})};
 wrap.append(s,b);e.append(wrap);
}
function showProposal(p){
 proposal=p;let e=$('proposal');e.innerHTML='';e.classList.toggle('hidden',!p);if(!p)return;
 let holder=currentPeople.find(x=>x.role===p.requestedRole);let target=roles[p.requestedRole]||'ROLL';let targetInfo=holder?'P'+holder.id+' har rollen':'rollen är LEDIG';let mine=p.requester===myId;
 e.append(document.createTextNode('ROLLBYTE: P'+p.requester+' vill ha '+target+' · '+targetInfo+' · '+p.approvals.length+'/'+p.total+' godkända'));
 if(!p.approvals.includes(myId)){let b=document.createElement('button');b.textContent='✓ GODKÄNN';b.onclick=()=>send({type:'roleApprove',proposalId:p.id});e.append(b)}
 if(mine){let b=document.createElement('button');b.textContent='AVBRYT';b.onclick=()=>send({type:'roleCancel',proposalId:p.id});e.append(b)}
}
function addChat(t){let d=document.createElement('div');d.textContent=t;$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight}
$('chatSend').onclick=()=>{let i=$('chatInput'),t=i.value.trim();if(t){send({type:'chat',text:t});i.value=''}};$('chatInput').onkeydown=e=>{if(e.key==='Enter')$('chatSend').click()};

function sticker(s,chaos){let z=s.size*(1+(chaos.amount/100)*.15),x=C.width*s.x/100,y=C.height*s.y/100;Q.save();Q.translate(x,y);Q.fillStyle=s.color;Q.beginPath();if(s.shape==='circle')Q.arc(0,0,z/2,0,Math.PI*2);else if(s.shape==='square')Q.rect(-z/2,-z/2,z,z);else if(s.shape==='heart'){Q.moveTo(0,z*.4);Q.bezierCurveTo(-z*.65,-z*.05,-z*.45,-z*.55,0,-z*.25);Q.bezierCurveTo(z*.45,-z*.55,z*.65,-z*.05,0,z*.4)}else for(let i=0;i<10;i++){let r=i%2?z*.22:z*.5,a0=-Math.PI/2+i*Math.PI/5,xx=Math.cos(a0)*r,yy=Math.sin(a0)*r;i?Q.lineTo(xx,yy):Q.moveTo(xx,yy)}Q.fill();Q.restore()}
function draw(st,preview=false){let p=st.points;if(p.length<2)return;let j=S.brush.jitter/100;Q.save();Q.globalAlpha=S.brush.opacity;Q.strokeStyle=S.draw.color;Q.lineWidth=S.brush.size;Q.lineCap='round';if(S.brush.type==='soft'){Q.shadowBlur=S.brush.size;Q.shadowColor=S.draw.color}if(S.brush.type==='dry')Q.globalAlpha*=.55;Q.beginPath();p.forEach((q,k)=>{let x=q.x*C.width,y=q.y*C.height;if(S.brush.type==='ink'){x+=Math.sin(k*.7)*j*4;y+=Math.cos(k*.5)*j*4}x+=Math.sin(k*S.brush.spacing)*j*18;y+=Math.cos(k*S.brush.spacing)*j*18;k?Q.lineTo(x,y):Q.moveTo(x,y)});Q.stroke();Q.restore()}
function texture(){let t=S.texture,s=Math.max(4,t.scale);Q.save();Q.globalAlpha=t.opacity;Q.fillStyle=t.color;Q.strokeStyle=t.color;Q.lineWidth=1;
 if(t.type==='noise'){let im=Q.createImageData(C.width,C.height),d=im.data;for(let i=0;i<d.length;i+=4){let v=90+Math.random()*165;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255*t.opacity*.32}Q.putImageData(im,0,0)}
 else if(t.type==='grain'){for(let i=0;i<9000;i++){let v=Math.random()*255;Q.globalAlpha=t.opacity*(.15+.7*Math.random());Q.fillStyle=`rgb(${v},${v},${v})`;Q.fillRect(Math.random()*C.width,Math.random()*C.height,1,1)}}
 else if(t.type==='dots')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.beginPath();Q.arc(x,y,1.5,0,7);Q.fill()}
 else if(t.type==='lines'||t.type==='hatch')for(let x=-C.height;x<C.width;x+=s*2){Q.beginPath();Q.moveTo(x,0);Q.lineTo(x+C.height,C.height);Q.stroke()}
 else if(t.type==='grid')for(let y=0;y<C.height;y+=s){Q.beginPath();Q.moveTo(0,y);Q.lineTo(C.width,y);Q.stroke()} 
 else if(t.type==='cross')for(let y=0;y<C.height;y+=s)for(let x=0;x<C.width;x+=s){Q.fillRect(x-1,y-1,3,3);Q.fillRect(x-1,y-s*.35,3,s*.7)}
 else if(t.type==='waves')for(let y=0;y<C.height;y+=s){Q.beginPath();for(let x=0;x<C.width;x+=4)Q.lineTo(x,y+Math.sin(x*.025)*s*.35);Q.stroke()}
 else if(t.type==='rings')for(let y=0;y<C.height;y+=s*2)for(let x=0;x<C.width;x+=s*2){Q.beginPath();Q.arc(x,y,s*.35,0,7);Q.stroke()}
 else if(t.type==='speckle')for(let i=0;i<C.width*C.height/(s*s)*2;i++){Q.beginPath();Q.arc(Math.random()*C.width,Math.random()*C.height,Math.random()*2+1,0,7);Q.fill()}
 else if(t.type==='scribble')for(let y=0;y<C.height;y+=s*1.5){Q.beginPath();for(let x=0;x<C.width;x+=5)Q.lineTo(x,y+Math.sin(x*.04+y)*s*.5);Q.stroke()}
 else if(t.type==='bubbles')for(let i=0;i<300;i++){let x=Math.random()*C.width,y=Math.random()*C.height,r=2+Math.random()*s*.4;Q.beginPath();Q.arc(x,y,r,0,7);Q.stroke()}
 Q.restore()}
function photo(p){let im=new Image();im.onload=()=>{let w=C.width*p.w/100,h=w*im.height/im.width,x=C.width*p.x/100-w/2,y=C.height*p.y/100-h/2;Q.drawImage(im,x,y,w,h)};im.src=p.src}
function scene(){
 let w=C.width,h=C.height,b=S.bg,r=b.angle*Math.PI/180;Q.clearRect(0,0,w,h);
 if(b.mode==='solid')Q.fillStyle=b.colorA;else{let g=Q.createLinearGradient(w/2-Math.cos(r)*w,h/2-Math.sin(r)*h,w/2+Math.cos(r)*w,h/2+Math.sin(r)*h);g.addColorStop(0,b.colorA);g.addColorStop(1,b.colorB);Q.fillStyle=g}Q.fillRect(0,0,w,h);
 texture();S.photos.forEach(photo);S.stickers.forEach(st=>sticker(st,S.chaos));S.draw.strokes.forEach(draw);
 Q.textAlign='center';Q.textBaseline='middle';S.textLayers.forEach(t=>{let x=w*t.x/100,y=h*t.y/100;Q.save();Q.translate(x,y);Q.transform((t.width||100)/100,0,Math.tan((t.skew||0)*Math.PI/180),(t.height||100)/100,0,0);Q.font=`${t.weight||'700'} ${t.size||42}px "${t.font||'Arial'}"`;Q.fillStyle=t.color||'#fff';if(t.shadow){Q.shadowColor='rgba(0,0,0,.6)';Q.shadowBlur=8}Q.fillText(t.value||'',0,0);Q.restore()});
}
function chaos(){
 let a=S.chaos.amount/100,f=S.chaos.frequency;X.clearRect(0,0,C.width,C.height);
 if(!a){X.drawImage(SC,0,0);return}
 const mode=S.chaos.mode;
 if(mode==='rotation'){X.save();X.translate(C.width/2,C.height/2);X.rotate(a*.12);X.drawImage(SC,-C.width/2,-C.height/2);X.restore();return}
 if(mode==='solarize'){X.drawImage(SC,0,0);let im=X.getImageData(0,0,C.width,C.height),d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i]<128?255-d[i]:d[i];d[i+1]=d[i+1]<128?255-d[i+1]:d[i+1];d[i+2]=d[i+2]<128?255-d[i+2]:d[i+2]}X.putImageData(im,0,0);return}
 if(mode==='echo'){X.drawImage(SC,0,0);X.globalAlpha=a*.28;for(let i=1;i<=3;i++)X.drawImage(SC,(i* a*18)%30,(i*a*14)%30);X.globalAlpha=1;return}
 if(mode==='glitch'||mode==='warp'||mode==='ripple'){
   let step=Math.max(2,Math.floor(40/f)),amp=a*(mode==='glitch'?120:mode==='ripple'?80:45);
   for(let y=0;y<C.height;y+=step){let off=Math.sin(y/f*.8)*amp+(mode==='glitch'&&Math.random()<.18? (Math.random()-.5)*amp*2:0);X.drawImage(SC,0,y,C.width,Math.min(step,C.height-y),off,y,C.width,Math.min(step,C.height-y))}
   return;
 }
 if(mode==='scatter'){X.drawImage(SC,0,0);let n=Math.floor(10+a*70);for(let i=0;i<n;i++){let x=Math.random()*C.width,y=Math.random()*C.height,w=20+Math.random()*80,h=10+Math.random()*50;X.drawImage(SC,x,y,w,h,x+(Math.random()-.5)*ampSafe(a,60),y+(Math.random()-.5)*ampSafe(a,60),w,h)}return}
 // jitter
 X.save();X.translate((Math.random()-.5)*a*40,(Math.random()-.5)*a*40);X.drawImage(SC,0,0);X.restore();
}
function ampSafe(a,n){return a*n}
function render(){scene();if(drawing&&pts.length>1)draw({points:pts},true);chaos()}
function point(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
C.onpointerdown=e=>{if(myRole!==6)return;drawing=true;pts=[point(e)];C.setPointerCapture(e.pointerId)};
C.onpointermove=e=>{if(!drawing)return;pts.push(point(e));render()};
C.onpointerup=()=>{if(drawing){drawing=false;if(pts.length>1)send({type:'stroke',points:pts});pts=[];render()}};
$('clear').onclick=()=>send({type:'clear'});
$('download').onclick=()=>{render();let a=document.createElement('a');a.download='kollektiv-poster.png';a.href=C.toDataURL('image/png');a.click()};

// Camera
let camStream=null;
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia){addChat('SYSTEM: kameran stöds inte av denna webbläsare.');return}
 const modal=document.createElement('div');modal.className='camera-modal';
 modal.innerHTML='<div class="camera-box"><video autoplay playsinline></video><div><button id="snap">TA BILD</button><button id="camClose">STÄNG</button></div></div>';
 document.body.append(modal);const v=modal.querySelector('video');
 try{camStream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=camStream}catch(e){modal.remove();addChat('SYSTEM: kunde inte öppna kameran.');return}
 modal.querySelector('#snap').onclick=()=>{let c=document.createElement('canvas');c.width=v.videoWidth||900;c.height=v.videoHeight||1200;c.getContext('2d').drawImage(v,0,0,c.width,c.height);filePhotoData(c.toDataURL('image/jpeg',.85));closeCam(modal)};
 modal.querySelector('#camClose').onclick=()=>closeCam(modal);
}
function closeCam(m){camStream?.getTracks().forEach(t=>t.stop());camStream=null;m.remove()}
function filePhoto(f){if(!f)return;let r=new FileReader();r.onload=()=>filePhotoData(r.result);r.readAsDataURL(f)}
function filePhotoData(src){S.photos.push({id:Date.now(),src,x:50,y:50,w:45});set('photos',S.photos)}
stat('OFFLINE');render();
</script></body></html>
